<style>
/* Layout: uma tela de jogo — barra de status no topo, campo de batalha de pedra iluminado por tocha, mão em leque embaixo; cartas de pergaminho e sprites em pixel art */
:root{
  --bg:#14110d; --bg2:#1c1812; --panel:#241e17; --line:#3d3326;
  --text:#ebe2cd; --muted:#a8997c;
  --parch:#eee3c6; --parch2:#d8c79f; --ink:#2b2219;
  --gold:#cfa548; --blood:#b23a2e; --steel:#7d97ab; --moss:#6f8f4e; --violet:#8a659a; --amber:#e0a23a; --ice:#86d0ec;
  --f-disp:"UnifrakturMaguntia","Old English Text MT",serif;
  --f-body:"IM Fell English",Georgia,serif;
  --f-sc:"IM Fell English SC",Georgia,serif;
  --f-num:"Alegreya Sans SC","Trebuchet MS",sans-serif;
  --cw:128px; --ch:180px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:16px;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[data-act]:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#screen{flex:1;min-height:0;position:relative}

/* ---------- sprites ---------- */
.spr{width:100%;aspect-ratio:1;background-size:200% 100%;background-repeat:no-repeat;image-rendering:pixelated;animation:sprIdle 1.1s steps(1,end) infinite}
.spr.flip{transform:scaleX(-1)}
.spr.fly{animation:sprIdle 1.1s steps(1,end) infinite,flyB 2.2s ease-in-out infinite}
@keyframes sprIdle{0%{background-position:0 0}50%{background-position:100% 0}}
@keyframes flyB{50%{translate:0 -9px}}

/* ---------- barra superior ---------- */
.top{display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap;padding-block:8px;border-bottom:1px solid var(--line);font-family:var(--f-sc)}
.top .hero{font-family:var(--f-disp);font-size:22px;color:var(--gold);letter-spacing:.02em}
.stat{display:flex;align-items:center;gap:6px;font-family:var(--f-num);font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}
.stat .ico{width:18px;height:18px}
.hpico{color:var(--blood)} .coin{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9a0,#c99a2e 60%,#7a5a14);border:1px solid #5a400c;flex:none}
.dia{width:13px;height:13px;flex:none;background:linear-gradient(135deg,#e6faff,#6fd3f5 45%,#2a7fb0);transform:rotate(45deg);border:1px solid #154a66;box-shadow:0 0 8px #6fd3f588;margin:0 2px}
.pots{display:flex;gap:4px}
.pot{width:30px;height:30px;border:1px dashed var(--line);border-radius:6px;display:grid;place-items:center;background:none;padding:0}
.pot.full{border-style:solid;border-color:#4d4030;background:#1f1a13}
.pot svg{width:22px;height:22px}
.relics{display:flex;gap:4px;flex-wrap:wrap}
.seal{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;font-family:var(--f-disp);font-size:16px;color:#f4e2c0;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--c) 70%,#fff),var(--c) 55%,color-mix(in srgb,var(--c) 60%,#000));box-shadow:0 1px 3px #000a;flex:none}
.gem{width:26px;height:26px;display:inline-grid;place-items:center;font:800 12px var(--f-num);color:#0e2a3a;background:linear-gradient(135deg,#e6faff,#6fd3f5 50%,#3a8fc0);clip-path:polygon(50% 0,100% 35%,80% 100%,20% 100%,0 35%);flex:none}
.top .sp{flex:1}
.tbtn{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 10px;font-family:var(--f-sc);font-size:15px}
.tbtn:hover{border-color:var(--gold)}
.tbtn.dev{color:#9fd18a;border-color:#3f5a33}
.tbtn.dev.on{background:#2c3f24}
#rotate{display:none}
@media (orientation:portrait) and (max-width:600px) and (pointer:coarse){body.in-combat:not(.rotok) #rotate{display:grid;position:fixed;inset:0;z-index:450;place-items:center;background:#0b0907f2;text-align:center;padding:24px max(16px,env(safe-area-inset-left,0px))}
 #rotate>div{display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--text)}#rotate svg{color:var(--gold);animation:rotA 2.4s ease-in-out infinite}#rotate b{font-family:var(--f-disp);font-weight:400;font-size:34px;color:var(--gold)}#rotate span{color:var(--muted);font-size:17px}}
@keyframes rotA{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (pointer:coarse){.pot{width:44px;height:44px}.pot svg{width:28px;height:28px}.tbtn{padding:9px 13px;font-size:16px}.pile{padding:8px 11px;font-size:15px}.endturn{padding:13px 18px}.seal,.gem{width:32px;height:32px}.optb{padding:10px 14px}}
/* barra de cima mais encorpada */
.top{padding-block:10px;min-height:58px;background:linear-gradient(#1e1710f5,#120d09ee);border-bottom:2px solid #6b5535;box-shadow:0 2px 0 #00000080,0 8px 20px #0008;gap:8px 12px}
.top .hero{font-size:25px;text-shadow:0 2px 0 #000}
.top .stat{background:#0d0a07cc;border:1px solid #3d3326;border-radius:999px;padding:5px 12px;box-shadow:inset 0 1px 0 #ffffff0d}
.top .stat .ico{width:20px;height:20px}.top .coin{width:18px;height:18px}.top .dia{width:15px;height:15px}
.top .pers{background:none;border:0}
.top .pots{background:#0d0a07cc;border:1px solid #3d3326;border-radius:10px;padding:3px}
.top .relics{background:#0d0a07cc;border:1px solid #3d3326;border-radius:999px;padding:3px 6px}
.top .tbtn{padding:7px 14px;font-size:16px;border-color:#5a4527;background:linear-gradient(#2e2419,#1c150e)}
#tip.lp{border-color:var(--gold);box-shadow:0 8px 24px #000c}
@media (max-height:500px){
 .top{flex-wrap:nowrap;gap:6px;padding-block:5px;min-height:0;overflow-x:auto;scrollbar-width:none}.top::-webkit-scrollbar{display:none}
 .top .hero{font-size:18px;white-space:nowrap}.top .pers{display:none}.top .stat{font-size:14px;white-space:nowrap;padding:3px 8px}.top .relics{padding:2px 4px;flex-wrap:nowrap;flex:none}.top .relics .seal,.top .relics .gem{width:24px;height:24px;font-size:12px}.top .pots{padding:2px}.top .stat .ico{width:14px;height:14px}
 .top .pot{width:34px;height:34px}.top .pot svg{width:22px;height:22px}.top .seal,.top .gem{width:26px;height:26px;font-size:13px}
 .top .tbtn{padding:6px 10px;font-size:14px;white-space:nowrap}.top .sp{min-width:4px}
 .top .stat.bonus,.top .stat[style*="f-sc"]{display:none}
}
.optpanel{gap:4px;width:100%}.optrow{display:flex;flex-direction:column;gap:4px;padding:10px 4px;border-bottom:1px solid var(--line)}.optrow:last-child{border-bottom:0}
.optrow b{font-family:var(--f-sc);font-weight:400;font-size:19px;color:var(--text)}.optrow span{color:var(--muted);font-size:14px}.optrow div{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.optb{background:#14100c;border:1px solid var(--line);border-radius:6px;padding:7px 12px;font-family:var(--f-sc);font-size:15px;color:var(--muted)}
.optrow .volrow{display:flex;flex-wrap:nowrap;align-items:center;gap:12px}
.vol{-webkit-appearance:none;appearance:none;flex:1;min-width:0;height:28px;background:transparent;cursor:pointer;margin:0;touch-action:none}
.vol:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:6px}
.vol::-webkit-slider-runnable-track{height:10px;border-radius:5px;border:1px solid var(--line);background:linear-gradient(90deg,var(--gold) var(--p,50%),#14100c var(--p,50%))}
.vol::-moz-range-track{height:10px;border-radius:5px;border:1px solid var(--line);background:#14100c}
.vol::-moz-range-progress{height:10px;border-radius:5px;background:var(--gold)}
.vol::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;margin-top:-8px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#ffe7a0,var(--gold) 55%,#7a5a1c);border:2px solid #2a2016;box-shadow:0 1px 4px #000a}
.vol::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#ffe7a0,var(--gold) 55%,#7a5a1c);border:2px solid #2a2016;box-shadow:0 1px 4px #000a}
.volpct{min-width:52px;text-align:right;font-family:var(--f-sc);font-size:18px;color:var(--gold);font-variant-numeric:tabular-nums}
.optb.danger{border-color:#8e2f26;color:#f0b3a8}.optb.danger:hover{border-color:#e0503f;background:#3a1612;color:#fff}
.optb:hover{border-color:#8a6a35}.optb.on{border-color:var(--gold);color:#fff3d6;background:#2a2014}

/* ---------- cartas ---------- */
.card{--rim:#6b6256;--band:#8e2f26;width:var(--cw);height:var(--ch);border-radius:calc(var(--cw)*.07);background:linear-gradient(170deg,var(--parch),var(--parch2));color:var(--ink);position:relative;border:3px solid var(--rim);box-shadow:0 4px 12px #000a,inset 0 0 18px #8a6a3a40;display:flex;flex-direction:column;align-items:center;padding:calc(var(--cw)*.06) calc(var(--cw)*.06) calc(var(--cw)*.05);font-size:calc(var(--cw)*.088);user-select:none;-webkit-user-select:none;cursor:pointer;flex:none;touch-action:none}
.r-basic{--rim:#6e655a}.r-common{--rim:#8a8679}.r-unc{--rim:#5d86a6}.r-rare{--rim:#d6ab4c}.r-special{--rim:#4b3d52}.r-lend{--rim:#6fd3f5}.r-arma{--rim:#e0782a}.r-arma{box-shadow:0 0 14px #ff7a2a77,0 4px 12px #000a}
.r-lend{box-shadow:0 0 16px #6fd3f588,0 4px 12px #000a}
.t-atk{--band:#8e2f26}.t-skl{--band:#3e5f78}.t-pwr{--band:#a07a26}.t-sts{--band:#5c5a55}.t-crs{--band:#4a2e57}
.cost{position:absolute;top:calc(var(--cw)*-.09);left:calc(var(--cw)*-.09);width:calc(var(--cw)*.27);height:calc(var(--cw)*.27);border-radius:50%;display:grid;place-items:center;font:800 calc(var(--cw)*.16)/1 var(--f-num);color:#2b1606;background:radial-gradient(circle at 35% 30%,#ffe0a0,#d98e2a 60%,#7a4210);border:2px solid #3b2a14;z-index:2}
.cost.free{background:radial-gradient(circle at 35% 30%,#d8ffd0,#5fbf4a 60%,#245a14)}
.cname{font-family:var(--f-sc);font-size:1.08em;text-align:center;line-height:1.05;min-height:2.15em;display:flex;align-items:center;justify-content:center}
.upg .cname{color:#2f6b2a}
.cart{width:100%;height:28%;border-radius:4px;background:radial-gradient(ellipse at 50% 40%,color-mix(in srgb,var(--band) 75%,#fff),var(--band) 70%);display:grid;place-items:center;box-shadow:inset 0 0 0 1px #0004}
.cart svg{height:70%;width:auto;fill:#f3e7c9;stroke:#f3e7c9}
.ctype{font-size:.72em;font-style:italic;opacity:.72;margin-top:2px}
.ctext{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.16;padding:0 2px}
.ctext b{font-family:var(--f-num);font-weight:800}
.ctext b.up{color:#2f7a2a}.ctext b.dn{color:#b3332a}
.card.unplayable .cost{background:radial-gradient(circle at 35% 30%,#bbb,#666);color:#222}
.card.sel{box-shadow:0 0 0 3px var(--gold),0 0 24px #f5c56aaa}
.card.big{--cw:150px;--ch:210px}
/* cartas v2.6: um estilo por classe */
.cl-cav{--frame:#1b2a52;--gold:#d9b45c;--nameBg:#10192f;--nameInk:#f3ead6;--paper:#efe4c8;--cink:#241a10}
.cl-cac{--frame:#16342a;--gold:#b9d6c4;--nameBg:#0c1f19;--nameInk:#e6f3ea;--paper:#e4ecdc;--cink:#16241c}
.cl-mag{--frame:#2a2046;--gold:#c9a24a;--nameBg:#17112b;--nameInk:#f3ead6;--paper:#e9e3f3;--cink:#201830}
.cl-tan{--frame:#2d3441;--gold:#e3b34f;--nameBg:#1a1f28;--nameInk:#f4f6f9;--paper:#e6e9ee;--cink:#1c2230}
.cl-nec{--frame:#14211c;--gold:#8fd0a0;--nameBg:#0a1210;--nameInk:#dcefe3;--paper:#dde6dc;--cink:#16201a}
.cl-any{--frame:#183b4a;--gold:#9fe6ff;--nameBg:#0b2330;--nameInk:#eafaff;--paper:#e2f3f8;--cink:#10222c}
.card[class*="cl-"]{background:var(--frame);color:var(--cink);gap:calc(var(--cw)*.022);padding:calc(var(--cw)*.05);box-shadow:0 4px 12px #000a,inset 0 0 0 calc(var(--cw)*.012) var(--gold)}
.card[class*="cl-"].r-arma{box-shadow:0 0 14px #ff7a2a77,0 4px 12px #000a,inset 0 0 0 calc(var(--cw)*.012) var(--gold)}
.card[class*="cl-"].r-lend{box-shadow:0 0 16px #6fd3f588,0 4px 12px #000a,inset 0 0 0 calc(var(--cw)*.012) var(--gold)}
.card[class*="cl-"] .cname{width:100%;box-sizing:border-box;background:var(--nameBg);color:var(--nameInk);border:1px solid var(--gold);border-radius:calc(var(--cw)*.03);min-height:0;white-space:nowrap;overflow:hidden;padding:calc(var(--cw)*.022) calc(var(--cw)*.05) calc(var(--cw)*.022) calc(var(--cw)*.15);font-size:1em;letter-spacing:.01em}
.card[class*="cl-"] .cname.nl{font-size:.88em}.card[class*="cl-"] .cname.nl2{font-size:.76em}
.card[class*="cl-"].upg .cname{color:#9be59a}
.card[class*="cl-"] .cart{flex:none;height:36%;border:2px solid var(--gold);border-radius:calc(var(--cw)*.03);overflow:hidden;background:none;box-shadow:inset 0 0 0 1px #0008;display:block}
.cl-cav .cart{border-radius:calc(var(--cw)*.28) calc(var(--cw)*.28) calc(var(--cw)*.03) calc(var(--cw)*.03)}
.cl-mag .cart{border-radius:calc(var(--cw)*.12) calc(var(--cw)*.12) calc(var(--cw)*.03) calc(var(--cw)*.03)}
.cl-tan .cart{clip-path:polygon(0 0,100% 0,100% 82%,50% 100%,0 82%);border:0;box-shadow:none}
.card[class*="cl-"] .cart svg{width:100%;height:100%;display:block;fill:none;stroke:none}
.card[class*="cl-"] .ctype{display:flex;align-items:center;justify-content:center;gap:calc(var(--cw)*.03);width:100%;font-style:normal;font-family:var(--f-sc);font-size:.74em;white-space:nowrap;opacity:1;margin:0;line-height:1;color:var(--gold);letter-spacing:.06em}
.rgs{display:inline-flex;gap:calc(var(--cw)*.018)}
.rg{width:calc(var(--cw)*.036);height:calc(var(--cw)*.036);background:var(--rim);transform:rotate(45deg);display:block;box-shadow:0 0 0 1px #0006}
.card[class*="cl-"] .ctext{flex:1;width:100%;box-sizing:border-box;background:var(--paper);border:1px solid var(--gold);border-radius:calc(var(--cw)*.03);padding:calc(var(--cw)*.02) calc(var(--cw)*.03);min-height:0;color:var(--cink);line-height:1.1}
.card[class*="cl-"] .cost{border-color:var(--gold)}
/* v2.9: cor do tipo só nos detalhes (vermelho ataque, azul defesa, verde cura, roxo magia) */
.k-atk{--kc:#e0503f;--kl:#ff9a8a}.k-def{--kc:#3f8fe0;--kl:#9cc8ff}.k-cura{--kc:#3fbf6a;--kl:#9ee8b4}.k-mag{--kc:#9a5ae0;--kl:#cfa8ff}
.card[class*="k-"] .cart{border-color:var(--kc)!important;box-shadow:inset 0 0 0 1px #0008,0 0 0 1px var(--kc)}
.card[class*="k-"] .ctype>span:first-child{color:var(--kl);display:inline-flex;align-items:center;gap:calc(var(--cw)*.025)}
.card[class*="k-"] .ctype>span:first-child::before{content:"";width:calc(var(--cw)*.045);height:calc(var(--cw)*.045);background:var(--kc);transform:rotate(45deg);box-shadow:0 0 0 1px #0008}
.card[class*="k-"] .cost{border-color:var(--kc)!important}

/* ---------- combate ---------- */
.combat{height:100%;display:grid;grid-template-rows:1fr auto;position:relative}
.field{--fl1:#1f170fe0;--fl2:#0d0a07;--fglow:#e0a23a24;position:relative;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:14px 4% 26px;min-height:0;background:radial-gradient(ellipse 60% 40% at 50% 100%,var(--fglow),transparent 70%),linear-gradient(180deg,transparent 0 50%,var(--fl1) 72%,var(--fl2) 100%);overflow:hidden}
.field::before{content:"";position:absolute;left:-30%;right:-30%;bottom:0;height:32%;background:repeating-linear-gradient(90deg,transparent 0 70px,#0000006b 70px 73px),repeating-linear-gradient(0deg,transparent 0 24px,#0000006b 24px 27px),linear-gradient(#2c2218,#120e0a);transform:perspective(240px) rotateX(42deg);transform-origin:50% 100%;opacity:.9;pointer-events:none;-webkit-mask-image:linear-gradient(transparent,#000 45%);mask-image:linear-gradient(transparent,#000 45%)}
.field::after{content:"";position:absolute;left:0;right:0;bottom:18px;height:2px;background:linear-gradient(90deg,transparent,#5a4527 20%,#5a4527 80%,transparent)}
.combat.act2 .field{--fl1:#121820e0;--fl2:#080a0d;--fglow:#86b0d01c}
.combat.act2 .field::before{background:repeating-linear-gradient(90deg,transparent 0 70px,#0000006b 70px 73px),repeating-linear-gradient(0deg,transparent 0 24px,#0000006b 24px 27px),linear-gradient(#1f262e,#0c0f13)}
.combat.act3 .field{--fl1:#24100be0;--fl2:#0e0605;--fglow:#ff5a2a26}
.combat.act3 .field::before{background:repeating-linear-gradient(90deg,transparent 0 70px,#0000006b 70px 73px),repeating-linear-gradient(0deg,transparent 0 24px,#0000006b 24px 27px),linear-gradient(#33180f,#140806)}
.combat.boss .field{box-shadow:inset 0 0 80px #6a3a9a55}
.side{display:flex;align-items:flex-end;gap:14px;position:relative;z-index:1}
.side.foes{justify-content:flex-end;flex-wrap:nowrap}
.unit{--s:1;--dir:-1;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;width:calc(118px*var(--s)*var(--fz,1))}
.unit.hero{--dir:1}
.unit .fig{width:100%;position:relative;transform-origin:50% 100%}
.unit.targetable{cursor:crosshair}
.unit.targetable .spr{filter:drop-shadow(0 0 4px #f2c66a)}
.unit.tgt .spr{filter:drop-shadow(0 0 10px #ffd477) brightness(1.15)}
.unit.tgt .uname{color:var(--gold)}
.unit.frozen .spr{filter:sepia(1) hue-rotate(165deg) saturate(2.4) brightness(1.2)}
.unit.frozen .fig::after{content:"";position:absolute;inset:10% 8% 0;border:2px solid #d8f4ff99;background:linear-gradient(135deg,#d8f4ff33,#86d0ec22);clip-path:polygon(10% 0,90% 6%,100% 60%,85% 100%,12% 96%,0 40%)}
.unit.ghosty .spr{opacity:.4}
.unit.dead .fig{animation:dieA .8s ease-in .2s forwards}
.unit.dead .u-int,.unit.dead .uinfo{opacity:0;transition:opacity .4s .3s}
.hp{width:100%;height:15px;background:#2a1513;border:1px solid #000;position:relative;border-radius:8px}
.hp i{display:block;height:100%;border-radius:8px;background:linear-gradient(#d0503f,#8e2a22);transition:width .3s}
.hp.blocked{border-color:#9ec3e0}
.hp.blocked i{background:linear-gradient(#8fb0c8,#4f6f88)}
.hp span{position:absolute;inset:0;font:800 12px/15px var(--f-num);text-align:center;color:#fff;text-shadow:0 1px 0 #000;font-variant-numeric:tabular-nums}
.blk{position:absolute;left:-16px;top:-8px;width:28px;height:30px;display:grid;place-items:center;font:800 13px var(--f-num);color:#fff;text-shadow:0 1px 0 #000;background:#5b7d97;clip-path:path("M14 0 L28 5 L28 14 C28 22 22 27 14 30 C6 27 0 22 0 14 L0 5 Z")}
.uname{font-family:var(--f-sc);font-size:14px;color:var(--muted);text-align:center;line-height:1.1}
.uinfo{width:100%;display:flex;flex-direction:column;align-items:center;gap:3px}
.sts{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;min-height:20px}
.st{font:800 11px/1 var(--f-num);padding:3px 5px;border-radius:4px;background:#3a2a1a;color:#f0d79a;border:1px solid #5b4426}
.st.bad{background:#3a1715;color:#ff9b8a;border-color:#6b2a24}
.u-int{min-height:30px;display:flex;align-items:center;gap:3px;font:800 17px var(--f-num);color:#f3e1c0;text-shadow:0 1px 0 #000}
.u-int svg{width:24px;height:24px}
.u-int.atk{color:#ff8e7a}
.servos{position:absolute;left:-66%;bottom:0;width:70%;display:flex;flex-wrap:wrap-reverse;justify-content:flex-end}
.servo{width:50%;filter:drop-shadow(0 0 4px #9b4ad088) brightness(.9) saturate(.8);aspect-ratio:1;background-size:200% 100%;image-rendering:pixelated;animation:sprIdle .9s steps(1,end) infinite}
.servo.new{animation:sprIdle .9s steps(1,end) infinite,sumA .6s ease-out}

/* movimentos */
.mv-lunge{animation:lunge .42s ease-out}
@keyframes lunge{25%{transform:translateX(calc(var(--dir)*-10px))}55%{transform:translateX(calc(var(--dir)*48px)) rotate(calc(var(--dir)*7deg))}100%{transform:none}}
.mv-shoot{animation:shoot .4s ease-out}
@keyframes shoot{30%{transform:translateX(calc(var(--dir)*-9px)) scaleX(.92)}60%{transform:translateX(calc(var(--dir)*4px))}100%{transform:none}}
.mv-cast{animation:cast .5s ease-out}
@keyframes cast{40%{transform:translateY(-14px) scale(1.05);filter:drop-shadow(0 0 12px #b88aff) brightness(1.25)}100%{transform:none;filter:none}}
.mv-hit{animation:hitA .38s ease-out}
@keyframes hitA{0%{filter:brightness(3) saturate(0)}30%{transform:translateX(calc(var(--dir)*-16px)) rotate(calc(var(--dir)*-6deg));filter:brightness(2) saturate(0)}100%{transform:none;filter:none}}
.mv-block{animation:blockA .42s ease-out}
@keyframes blockA{35%{transform:scale(1.08,.92);filter:drop-shadow(0 0 12px #9ec3e0) brightness(1.2)}100%{transform:none;filter:none}}
.mv-buff{animation:buffA .55s ease-out}
@keyframes buffA{40%{transform:translateY(-18px);filter:drop-shadow(0 0 14px #f0cf7a) brightness(1.35)}70%{transform:translateY(2px) scale(1.04,.96)}100%{transform:none;filter:none}}
.mv-heal{animation:healA .6s ease-out}
@keyframes healA{40%{filter:drop-shadow(0 0 14px #8bd36a) brightness(1.35);transform:translateY(-6px)}100%{transform:none;filter:none}}
.mv-dodge{animation:dodgeA .45s ease-out}
@keyframes dodgeA{35%{transform:translateX(calc(var(--dir)*-40px)) skewX(calc(var(--dir)*-12deg));opacity:.3}100%{transform:none;opacity:1}}
.mv-summon{animation:sumA .65s ease-out}
@keyframes sumA{0%{transform:translateY(30px) scale(.2);opacity:0;filter:brightness(4)}70%{opacity:1}100%{transform:none;filter:none}}
.mv-enter{animation:enterA .75s ease-out both}
@keyframes enterA{0%{transform:translateX(calc(var(--dir)*-170px));opacity:0}55%{opacity:1}70%{transform:translateY(-8px)}85%{transform:translateY(0)}92%{transform:translateY(-3px)}100%{transform:none}}
.mv-freeze{animation:freezeA .5s ease-out}
@keyframes freezeA{0%{filter:brightness(3)}50%{transform:scale(1.06)}100%{transform:none;filter:none}}
.mv-victory{animation:vicA .9s ease-out}
@keyframes vicA{20%{transform:translateY(-22px)}40%{transform:none}60%{transform:translateY(-12px)}80%{transform:none}}
@keyframes dieA{0%{filter:brightness(3)}30%{transform:rotate(calc(var(--dir)*-10deg));filter:none}100%{transform:translateY(20px) rotate(calc(var(--dir)*-90deg)) scale(.8);opacity:0;filter:grayscale(1)}}

.dock{display:grid;grid-template-columns:auto 1fr auto;align-items:end;gap:12px;padding-block:6px 10px}
.dl,.dr{display:flex;flex-direction:column;align-items:center;gap:8px;padding-bottom:4px}
.energy{width:66px;height:66px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe0a0,#d98e2a 55%,#6b3a10);display:grid;place-items:center;font:800 24px var(--f-num);color:#2b1606;border:3px solid #3b2a14;box-shadow:0 0 18px #e0a23a55}
.energy small{font-size:13px}
.energy.empty{filter:grayscale(.8) brightness(.7);box-shadow:none}
.pile{background:#211b14;border:1px solid var(--line);border-radius:6px;padding:4px 9px;font-family:var(--f-sc);font-size:14px;color:var(--muted);white-space:nowrap}
.pile b{font-family:var(--f-num);color:var(--text);margin-left:3px}
.pile:hover{border-color:var(--gold)}
.endturn{background:linear-gradient(#b8432f,#7c241b);border:2px solid #3a120d;border-radius:30px;padding:10px 16px;font-family:var(--f-sc);font-size:17px;color:#fbe9cf;box-shadow:0 3px 0 #2a0c08;white-space:nowrap}
.endturn:hover:not(:disabled){filter:brightness(1.12)}
.endturn:disabled{filter:grayscale(.9) brightness(.6);cursor:default}
.piles{display:flex;flex-direction:column;gap:4px;align-items:stretch}
.hand{position:relative;height:calc(var(--ch) + 18px);min-width:0}
.hand .card{position:absolute;left:0;bottom:0;transform-origin:50% 100%;transform:translate(var(--x,0),var(--y,0)) rotate(var(--r,0));transition:transform .14s ease-out}
.hand .card::after{content:"";position:absolute;left:0;right:0;top:100%;height:30px}
.hand .card:hover,.hand .card.sel{transform:translate(var(--x,0),-26px) scale(1.14);z-index:60!important}
.card.dragging{position:fixed!important;transform:scale(1.05) rotate(-2deg)!important;transition:none!important;z-index:200!important;pointer-events:none;box-shadow:0 18px 30px #000c}
.hint{position:absolute;left:50%;top:6px;transform:translateX(-50%);font-family:var(--f-sc);font-size:14px;color:var(--muted);pointer-events:none;white-space:nowrap;z-index:2}
.devstrip{position:absolute;left:8px;top:30px;z-index:3;font:500 12px var(--f-num);color:#9fd18a;background:#0d140bdd;border:1px solid #3f5a33;border-radius:6px;padding:4px 8px;max-width:46%}
.devstrip:empty{display:none}

/* ---------- efeitos ---------- */
#fxlayer{position:fixed;inset:0;pointer-events:none;z-index:300}
.float{position:fixed;transform:translate(-50%,0);font:800 28px var(--f-num);color:#ff6a50;text-shadow:0 2px 0 #000,0 0 6px #000;animation:floatUp 1.05s ease-out forwards;white-space:nowrap}
.float.blk{color:#a9cbe6;font-size:20px}.float.heal{color:#8bd36a}.float.st{font-size:16px;color:#f0cf7a}.float.nrg{font-size:18px;color:#ffc35a}.float.bad{font-size:16px;color:#ff9b8a}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,8px) scale(.8)}15%{opacity:1;transform:translate(-50%,0) scale(1.1)}100%{opacity:0;transform:translate(-50%,-56px)}}
.proj{position:fixed;left:0;top:0;pointer-events:none;transition:transform .26s linear}
.proj.arrow{width:36px;height:3px;margin:-1.5px 0 0 -18px;background:linear-gradient(90deg,#e8dcc0 0 12%,#8a6a3a 12% 80%,#dfe6ea 80%)}
.proj.bolt,.proj.fire,.proj.dark,.proj.hex,.proj.web{width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%}
.proj.bolt{background:radial-gradient(#fff,#7fd0ff 45%,#2a6fd0 75%,transparent);box-shadow:0 0 16px #7fd0ff}
.proj.fire{width:22px;height:22px;margin:-11px;background:radial-gradient(#fff6c0,#ffb030 40%,#e0401a 70%,transparent);box-shadow:0 0 18px #ff8030}
.proj.dark{background:radial-gradient(#e6c8ff,#9b4ad0 45%,#3a0a5a 75%,transparent);box-shadow:0 0 16px #9b4ad0}
.proj.hex{width:14px;height:14px;margin:-7px;background:radial-gradient(#ffd0ff,#b04ac0 60%,transparent);box-shadow:0 0 10px #b04ac0}
.proj.web{background:radial-gradient(#fff 20%,#ddd 40%,transparent 70%);box-shadow:0 0 6px #fff}
.proj.ice{width:26px;height:9px;margin:-4.5px 0 0 -13px;background:linear-gradient(90deg,transparent,#d8f4ff 40%,#86d0ec);clip-path:polygon(0 50%,65% 0,100% 50%,65% 100%);filter:drop-shadow(0 0 6px #86d0ec)}
.proj.bone{width:16px;height:6px;margin:-3px 0 0 -8px;border-radius:3px;background:#e0d8c2;box-shadow:0 0 4px #000}
.proj.beam{width:46px;height:5px;margin:-2.5px 0 0 -23px;background:linear-gradient(90deg,transparent,#ff5af0,#fff);box-shadow:0 0 12px #ff5af0}
.burst{position:fixed;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;background:radial-gradient(var(--bc,#fff) 0 20%,transparent 65%);animation:burstA .35s ease-out forwards;pointer-events:none}
@keyframes burstA{0%{transform:scale(.3);opacity:1}100%{transform:scale(1.6);opacity:0}}
.slash{position:fixed;width:96px;height:96px;margin:-48px 0 0 -48px;border-radius:50%;border-top:5px solid #fff;border-right:3px solid #fff8;animation:slashA .32s ease-out forwards;filter:drop-shadow(0 0 6px #fff);pointer-events:none}
@keyframes slashA{0%{opacity:0;transform:rotate(-90deg) scale(.6)}30%{opacity:1}100%{opacity:0;transform:rotate(70deg) scale(1.1)}}
.banner{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);font-family:var(--f-disp);font-size:46px;color:var(--gold);text-shadow:0 3px 0 #000,0 0 30px #000;animation:bannerA 1.1s ease-out forwards;white-space:nowrap}
@keyframes bannerA{0%{opacity:0;letter-spacing:.3em}25%{opacity:1;letter-spacing:.04em}75%{opacity:1}100%{opacity:0}}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:#2a1513;border:1px solid #6b2a24;color:#ffd2c8;padding:7px 14px;border-radius:6px;font-family:var(--f-sc);animation:toastA 1.6s forwards}
@keyframes toastA{0%{opacity:0}10%{opacity:1}80%{opacity:1}100%{opacity:0}}
#tip{position:fixed;z-index:400;max-width:260px;background:#0f0c09f2;border:1px solid #5b4426;border-radius:6px;padding:7px 10px;font-size:14px;line-height:1.3;pointer-events:none;color:var(--text)}
#tip b{font-family:var(--f-sc);color:var(--gold);font-weight:400;display:block}

/* ---------- telas genéricas ---------- */
.page{height:100%;overflow:auto;padding-block:24px 40px;display:flex;flex-direction:column;align-items:center;gap:18px}
.h1{font-family:var(--f-disp);font-size:clamp(34px,7vw,68px);color:var(--gold);text-align:center;line-height:1;text-shadow:0 3px 0 #000;text-wrap:balance;margin:0}
.h2{font-family:var(--f-sc);font-size:28px;color:var(--gold);margin:0;text-align:center}
.lead{max-width:60ch;text-align:center;color:var(--muted);font-size:18px;line-height:1.45;margin:0}
.btn{background:linear-gradient(#3b2f22,#261e15);border:1px solid #6b5535;border-radius:8px;padding:10px 20px;font-family:var(--f-sc);font-size:19px;color:var(--text);box-shadow:0 2px 0 #0008}
.btn:hover:not(:disabled){border-color:var(--gold);color:#fff3d6}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:linear-gradient(#b8432f,#7c241b);border-color:#3a120d;color:#fbe9cf}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center}
.howto{max-width:680px;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px 18px;color:var(--muted);font-size:15px;line-height:1.35;margin:6px 0 0}
.howto b{font-family:var(--f-sc);color:var(--text);font-weight:400;display:block}
.emblem{width:170px;max-width:45%}
.seedin{background:#100d0a;border:1px solid var(--line);border-radius:6px;color:var(--text);padding:6px 8px;font:500 15px var(--f-num);width:150px}
.chars{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;width:min(1100px,100%)}
.charc.locked .ped,.charc.locked h3,.charc.locked .stat,.charc.locked p{filter:grayscale(.85) brightness(.55)}
.charc.locked{border-color:#6a5230}
.lockb{position:absolute;top:10px;right:10px;z-index:3;display:flex;align-items:center;gap:6px;padding:5px 10px 5px 8px;border-radius:999px;background:#1a120a;border:1px solid #d9b45c;color:#f3dfa8;font:600 12px var(--f-sc,serif);letter-spacing:.06em;box-shadow:0 2px 10px #000a}
.lockb svg{width:16px;height:16px;fill:#d9b45c}
.charc{position:relative;background:radial-gradient(ellipse 90% 55% at 50% 0%,#e0a23a1c,transparent 70%),linear-gradient(#1d1812f2,#110d0af2);border:1px solid var(--line);border-radius:6px;padding:18px 16px 16px;display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center;box-shadow:inset 0 1px 0 #ffffff0d,0 10px 30px #0009;transition:transform .2s,border-color .2s,box-shadow .2s;animation:charIn .6s ease-out both;animation-delay:var(--d,0s)}
.charc::after{content:"";position:absolute;left:12px;right:12px;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.35;transition:opacity .2s}
.charc:hover,.charc:focus-visible{border-color:#8a6a35;transform:translateY(-5px);box-shadow:inset 0 1px 0 #ffffff14,0 16px 40px #000c,0 0 34px #e0a23a26}
.charc:hover::after,.charc:focus-visible::after{opacity:1}
.charc .ped{position:relative;width:120px;display:grid;place-items:center}
.charc .ped::after{content:"";position:absolute;left:12%;right:12%;bottom:4%;height:12px;border-radius:50%;background:radial-gradient(#000c,transparent 70%);z-index:-1}
.charc .spr{width:110px;filter:drop-shadow(0 0 10px #e0a23a33)}
@keyframes charIn{0%{opacity:0;transform:translateY(18px)}100%{opacity:1;transform:none}}
.pick-h{font-family:var(--f-disp);font-weight:400;font-size:clamp(30px,5vw,46px);color:var(--gold);margin:0;text-align:center;text-shadow:0 3px 0 #000;text-wrap:balance}
.charc h3{font-family:var(--f-disp);font-size:26px;color:var(--gold);margin:0;font-weight:400;line-height:1.05}
.charc p{margin:0;color:var(--muted);line-height:1.35;font-size:15px}
.charc .rel{font-size:13px;display:flex;gap:8px;align-items:center;text-align:left}

/* mapa */
.mapwrap{height:100%;overflow:auto;display:flex;justify-content:center;position:relative}
.mapwrap svg{width:min(720px,100%);height:auto;flex:none;align-self:flex-start}
.tun{stroke:#050403;stroke-width:18;fill:none;stroke-linecap:round;opacity:.8}
.edge{stroke:#6a5438;stroke-width:3;stroke-dasharray:2 8;stroke-linecap:round;fill:none}
.edge.walked{stroke:var(--gold);stroke-dasharray:none;stroke-width:3.5;opacity:.9}
.node .ic{fill:#cdbb95;stroke:#cdbb95}
.node.t-forja .ic{fill:#ff8a3a;stroke:#ff8a3a}.node.t-elite .ic{fill:#e07a6a;stroke:#e07a6a}.node.t-fogueira .ic{fill:#f0a040;stroke:#f0a040}.node.t-loja .ic{fill:#e8cc6a;stroke:#e8cc6a}.node.t-tesouro .ic{fill:#d8b36a;stroke:#d8b36a}
.portal .hole,.lair .hole{fill:url(#mhole)}
.lair .hole{fill:url(#mlair)}
.portal .rim,.lair .rim{fill:none;stroke:#77685a;stroke-width:5;stroke-linejoin:round}
.portal .key{fill:#8a7a66}.portal .sill,.lair .sill{fill:#8a7a66}
.portal .aura,.lair .aura{fill:url(#maura);opacity:0;transition:opacity .3s}
.portal .seal{fill:none;stroke:var(--gold);stroke-width:3;stroke-linecap:round}
.node.done .ic{fill:#5f5444;stroke:#5f5444}
.node.done .rim{stroke:#9a7a3a}
.node.avail{cursor:pointer}
.node.avail .aura{opacity:1;animation:auraP 1.6s ease-in-out infinite}
.node.avail .rim{stroke:var(--gold)}
.node.avail .key{fill:var(--gold)}
.node.avail:hover .hole,.node.avail:focus-visible .hole{fill:#3a2c1c}
.node.avail:focus{outline:none}.node.avail:focus-visible .rim{stroke:#fff3d6}
.lair.avail:hover .hole{fill:url(#mlair)}
@keyframes auraP{50%{opacity:.45}}
.m-act{font-family:var(--f-disp);font-size:40px;fill:var(--gold)}
.m-sub{font:500 12px var(--f-num);letter-spacing:.28em;text-transform:uppercase;fill:#a8997c}
.m-boss{font-family:var(--f-disp);font-size:30px;fill:#f0c46a;paint-order:stroke;stroke:#000;stroke-width:4}
.m-depth .d1{font:800 12px var(--f-num);letter-spacing:.18em;text-transform:uppercase;fill:#8c7d63}
.m-depth .d2{font:500 12px var(--f-num);fill:#5d5242}
@media (max-width:600px){.m-depth .d1{font-size:19px;letter-spacing:.06em}.m-depth .d2{display:none}.m-sub{font-size:18px;letter-spacing:.14em}.m-act{font-size:52px}}
.m-depth.past .d1{fill:#6a5c48}.m-depth.here .d1{fill:var(--gold)}.m-depth .d1.boss{fill:#e07a6a}
#tok image{image-rendering:pixelated}
.legend{position:sticky;top:12px;align-self:flex-start;margin-left:12px;background:#1a1510ee;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-family:var(--f-sc);font-size:14px;color:var(--muted);display:grid;gap:4px;flex:none}
.legend svg{width:20px;height:20px;vertical-align:middle;margin-right:6px}
.maptitle{position:sticky;top:12px;align-self:flex-start;margin-right:12px;flex:none;font-family:var(--f-sc);color:var(--muted);font-size:15px;max-width:160px;line-height:1.3}
.maptitle b{display:block;font-family:var(--f-disp);font-size:26px;color:var(--gold);font-weight:400}

/* recompensas, loja, fogueira, evento */
.panel{background:linear-gradient(#211b14,#1a1510);border:1px solid var(--line);border-radius:10px;padding:18px;width:min(560px,100%);display:flex;flex-direction:column;gap:10px}
.ritem{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#14100c;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:17px}
.ritem:hover{border-color:var(--gold)}
.ritem .ri{width:30px;height:30px;display:grid;place-items:center;flex:none}
.ritem small{color:var(--muted);font-size:14px;margin-left:auto;text-align:right}
.shopgrid{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;max-width:960px}
.ware{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:none;padding:0}
.ware.sold{opacity:.25;pointer-events:none}
.ware.poor .price{color:#b0574a}
.price{font:800 16px var(--f-num);color:#f0cf7a;display:flex;align-items:center;gap:5px}
.wbox{width:160px;min-height:96px;background:#14100c;border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:14px;line-height:1.25;color:var(--muted)}
.wbox b{font-family:var(--f-sc);color:var(--text);font-weight:400;font-size:15px}
.wbox.dwb{border-color:#2a6a8a;background:#0e161b}
.ware:hover .wbox,.ware:hover .card{border-color:var(--gold)}
.choice{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;background:#14100c;border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.choice b{font-family:var(--f-sc);font-weight:400;font-size:19px;color:var(--text)}
.choice span{color:var(--muted);font-size:15px}
.choice:hover:not(:disabled){border-color:var(--gold)}
.choice:disabled{opacity:.4;cursor:default}
.wtalk{width:min(620px,100%)}
.wl{margin:0;font-size:18px;line-height:1.5}.wl.nar{font-style:italic;color:var(--muted)}.wl.say{color:var(--text)}
.wl.new{animation:fadeUp .5s ease-out both}
.wgot{margin:0;color:var(--muted);font-size:17px}.wgot b{color:var(--gold);font-family:var(--f-sc);font-weight:400}
.wscene .fire{width:80px;height:80px}
.unit.ally{--s:.9}
.unit.hero.nec{margin-left:64px}
@media (max-width:760px){.unit.hero.nec{margin-left:48px}}
.stat.bonus{font-size:14px;color:#f0cf7a}
.evtext{font-size:19px;line-height:1.5;max-width:58ch;margin:0}
.evtext::first-letter{font-family:var(--f-disp);font-size:2.6em;float:left;line-height:.85;margin:4px 8px 0 0;color:var(--gold)}
.scene{display:flex;align-items:flex-end;gap:10px}
.scene .spr{width:120px}
.fire{width:110px;height:110px}
.flame{animation:flick 1.4s ease-in-out infinite;transform-origin:50% 100%}
@keyframes flick{50%{transform:scaleY(1.08) skewX(2deg)}}
.stats{display:grid;grid-template-columns:auto auto;gap:4px 24px;font-size:18px}
.stats dd{margin:0;font:800 18px var(--f-num);text-align:right}
.stats dt{color:var(--muted)}
.diahead{display:flex;align-items:center;gap:10px;font:800 22px var(--f-num);color:#bfeeff}
.diahead .dia{width:20px;height:20px}

/* modal */
.modal{position:fixed;inset:0;z-index:250;background:#000c;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.mbox{width:min(1040px,100%);display:flex;flex-direction:column;gap:14px;align-items:center}
.mbox .sub{color:var(--muted);margin:0;text-align:center}
.mgrid{display:flex;flex-wrap:wrap;gap:18px 14px;justify-content:center;padding:10px 0}
.mgrid .card:hover{transform:translateY(-4px) scale(1.04);transition:transform .12s}
.mgrid .ord{font:800 12px var(--f-num);color:var(--muted);text-align:center;margin-top:4px}
.mfoot{display:flex;gap:10px;position:sticky;bottom:0;padding:10px;background:#000a;border-radius:10px}
.small{font-size:14px;padding:6px 12px}

/* painel dev */
#dev{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);z-index:240;background:#0d0f0b;border-left:2px solid #3f5a33;overflow:auto;padding:10px max(12px,env(safe-area-inset-right,0px)) 30px 12px;font-family:var(--f-num);font-weight:500;font-size:14px;color:#d8e6cf;box-shadow:-10px 0 30px #000a}
#dev h3{margin:12px 0 6px;font:800 13px var(--f-num);letter-spacing:.08em;color:#9fd18a;text-transform:uppercase}
@media (min-width:1100px){body.devopen #app{padding-right:416px}}
.dtabs{display:flex;gap:4px;flex-wrap:wrap;position:sticky;top:-10px;background:#0d0f0b;padding:6px 0;z-index:2}
.dtabs button,.dbtn{background:#18210f;border:1px solid #3f5a33;border-radius:5px;padding:4px 8px;font:500 13px var(--f-num);color:#cfe3c2}
.dtabs button.on,.dbtn.on{background:#3f5a33;color:#fff}
.dbtn:hover,.dtabs button:hover{border-color:#9fd18a}
.dgrid{display:flex;flex-wrap:wrap;gap:10px 8px}
.dgrid .card{--cw:84px;--ch:118px}
.dgrid .wrap{display:flex;flex-direction:column;align-items:center;gap:2px}
.dgrid .ord{font:800 11px var(--f-num);color:#9fd18a}
.dbtns{display:flex;flex-wrap:wrap;gap:5px}
.dline{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid #1f2a18;padding:3px 0}
.dmv{color:#9fb393;font-size:12px}
.dmv b{color:#ffd27a}
.dclose{float:right}
.dspr{display:flex;flex-wrap:wrap;gap:6px}
.dspr .spr{width:48px}

@media (max-width:760px){
  :root{--cw:86px;--ch:122px}
  .unit{width:calc(80px*var(--s)*var(--fz,1))}
  .energy{width:50px;height:50px;font-size:18px}
  .endturn{padding:8px 10px;font-size:14px}
  .pile{font-size:12px;padding:3px 6px}
  .top{gap:6px 12px}.top .hero{font-size:18px}
  .hint{display:none}
  .legend,.maptitle{display:none}
  .field{padding-inline:2%}
  .unit.hero{margin-left:38px}
  .side{gap:4px}
  .uname{font-size:12px}
}
@media (max-height:640px){:root{--cw:100px;--ch:140px}.unit{width:calc(96px*var(--s)*var(--fz,1))}}
/* celular em pé: a mão ocupa a largura toda, energia e botões numa linha embaixo */
@media (max-width:600px){
  .dock{grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"hand hand hand" "dl . dr";row-gap:14px}
  .hand{grid-area:hand}.dl{grid-area:dl;flex-direction:row}.dr{grid-area:dr;flex-direction:row;align-items:center}
  .combat{grid-template-columns:minmax(0,1fr)}
  :root{--cw:84px;--ch:118px}.hand{min-height:calc(var(--ch) + 22px)}
  .top{gap:5px 6px;padding-block:4px}.top .hero{font-size:17px;white-space:nowrap}.top .pers{display:none}.top .stat{font-size:13px;padding:3px 7px;white-space:nowrap}.top .stat .ico{width:14px;height:14px}
  .top .pot{width:32px;height:32px}.top .pot svg{width:20px;height:20px}.top .pots{padding:2px}.top .relics{padding:2px 4px}.top .seal,.top .gem{width:24px;height:24px;font-size:12px}.top .tbtn{padding:5px 9px;font-size:13px;white-space:nowrap}.top .sp{display:none}
}
/* celular deitado: tela baixa, tudo menor para as intenções dos inimigos caberem */
@media (max-height:460px){
  :root{--cw:80px;--ch:112px}
  .unit{width:calc(62px*var(--s)*var(--fz,1))}
  .top{padding-block:3px}.top .hero{font-size:17px}
  .hint{display:none}
  .field{padding-top:4px;padding-bottom:22px}
  .u-int{min-height:22px;font-size:14px}.u-int svg{width:18px;height:18px}
  .energy{width:44px;height:44px;font-size:16px}
  .endturn{padding:6px 10px;font-size:14px}
  .unit.hero{margin-left:30px}
}
/* ---------- cenário vivo, menu e cinema ---------- */
#bg{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;image-rendering:pixelated;pointer-events:none}
#app{position:relative;z-index:1}
.top{background:linear-gradient(#0c0a08f2,#0c0a08b8);border-bottom-color:#5a4527}
.dock{background:linear-gradient(180deg,#0a080600,#0a0806e0 38%);border-radius:10px 10px 0 0}
.mapwrap svg{box-shadow:0 0 0 1px #3d3326,0 20px 60px #000c;border-radius:4px}
#screen.scr-in{animation:scrIn .45s ease-out}
@keyframes scrIn{0%{opacity:0}100%{opacity:1}}
#intro{position:fixed;inset:0;background:#000;z-index:600;pointer-events:none;animation:introA 1.8s ease-in .2s forwards}
@keyframes introA{100%{opacity:0;visibility:hidden}}

.title{justify-content:flex-start;gap:12px;padding-block:max(2vh,10px) 30px}
.t-window{position:relative;flex:none;width:min(46vw,250px);height:min(42vh,320px);max-width:100%}
.t-window .spr{position:absolute;left:50%;bottom:-3px;width:58%;translate:-50% 0;filter:drop-shadow(0 0 8px #9db8ff55) drop-shadow(0 4px 4px #000)}
.t-kick{display:flex;align-items:center;gap:12px;margin:6px 0 0;font:500 12px var(--f-num);letter-spacing:.34em;text-transform:uppercase;color:var(--muted);animation:fadeUp .8s ease-out .5s both}
.t-kick::before,.t-kick::after{content:"";width:34px;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.t-kick::after{transform:scaleX(-1)}
.t-name{margin:0;font-family:var(--f-disp);font-weight:400;font-size:clamp(44px,9vw,88px);line-height:.92;text-align:center;text-wrap:balance;color:#e9c46a;background:linear-gradient(180deg,#fff3cc 0%,#efcd77 34%,#a8731f 58%,#f2d488 76%,#6e4a12 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 3px 0 #000) drop-shadow(0 0 22px #e0a23a40);animation:tName 1.8s cubic-bezier(.2,.7,.2,1) .7s both}
@keyframes tName{0%{opacity:0;letter-spacing:.3em}100%{opacity:1;letter-spacing:.005em}}
.t-lead{max-width:46ch;margin:0;text-align:center;color:var(--muted);font-size:17px;line-height:1.45;text-wrap:pretty;animation:fadeUp .8s ease-out 1.3s both}
@keyframes fadeUp{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:none}}
.t-menu{display:flex;flex-direction:column;gap:9px;width:min(340px,100%);margin-top:8px}
.t-item{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;padding:12px 40px;border:0;border-radius:0;background:linear-gradient(#2b2219,#16110c);color:var(--text);font-family:var(--f-sc);font-size:21px;line-height:1.1;box-shadow:inset 0 1px 0 #ffffff14,inset 0 -2px 0 #0008;clip-path:polygon(12px 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,12px 100%,0 50%);transition:background .2s,color .2s;animation:fadeUp .6s ease-out both;animation-delay:var(--d,1.5s)}
.t-item small{font-family:var(--f-body);font-style:italic;font-size:14px;color:var(--muted)}
.t-item::before,.t-item::after{content:"";position:absolute;top:50%;width:7px;height:7px;background:var(--gold);transform:translateY(-50%) rotate(45deg) scale(0);transition:transform .2s}
.t-item::before{left:20px}.t-item::after{right:20px}
.t-item:hover,.t-item:focus-visible{background:linear-gradient(#3b2e20,#21190f);color:#fff3d6;outline:none}
.t-item:hover::before,.t-item:hover::after,.t-item:focus-visible::before,.t-item:focus-visible::after{transform:translateY(-50%) rotate(45deg) scale(1)}
.t-item.primary{background:linear-gradient(#a33d2a,#5c1a12);color:#fbe9cf;font-size:23px}
.t-item.primary:hover,.t-item.primary:focus-visible{background:linear-gradient(#bf4a33,#6e2116)}
.t-item.dim{background:none;box-shadow:none;font-size:15px;padding:6px 40px;color:var(--muted)}
.t-item.dim:hover,.t-item.dim:focus-visible{background:none;color:#9fd18a}
.t-foot{margin:6px 0 0;font:500 12px var(--f-num);letter-spacing:.2em;text-transform:uppercase;color:#6d6150;animation:fadeUp .6s ease-out 2.1s both}
@media (max-width:460px){.t-kick{letter-spacing:.2em;font-size:11px}.t-kick::before,.t-kick::after{width:18px}}
@media (max-height:640px){.t-window{height:min(34vh,240px);width:min(40vw,200px)}.t-name{font-size:clamp(38px,7vw,60px)}.t-lead{display:none}}

.cine{position:fixed;inset:0;pointer-events:none;z-index:320}
.cine::before,.cine::after{content:"";position:absolute;left:0;right:0;height:13vh;background:#000;animation:cineBar 2.8s ease-in-out forwards}
.cine::before{top:0;transform-origin:top}.cine::after{bottom:0;transform-origin:bottom}
@keyframes cineBar{0%{transform:scaleY(0)}14%,80%{transform:scaleY(1)}100%{transform:scaleY(0)}}
.cine .cn{position:absolute;left:16px;right:16px;top:36%;text-align:center;font-family:var(--f-disp);font-size:clamp(42px,8vw,80px);line-height:1;color:var(--gold);text-shadow:0 3px 0 #000,0 0 40px #000,0 0 80px #000;animation:cineName 2.8s ease-out forwards}
.cine .cs{position:absolute;left:16px;right:16px;top:calc(36% + clamp(52px,9.5vw,94px));text-align:center;font:500 14px var(--f-num);letter-spacing:.36em;text-transform:uppercase;color:#d9c9a6;text-shadow:0 2px 0 #000;animation:cineName 2.8s ease-out .15s both}
@keyframes cineName{0%{opacity:0;transform:scale(1.12);letter-spacing:.18em}22%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
#abert{position:fixed;inset:0;z-index:550;background:#000;transition:opacity .8s}
#abert.out{opacity:0}
#abert video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.ab-start{position:absolute;left:0;right:0;bottom:12%;display:flex;flex-direction:column;align-items:center;gap:10px;padding-inline:16px}
.ab-start .t-item{width:min(340px,100%)}
.ab-skip{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:#000a;border:1px solid #ffffff40;border-radius:4px;color:#ebe2cd;font-family:var(--f-sc);font-size:16px;padding:8px 14px}
.ab-skip:hover,.ab-skip:focus-visible{border-color:var(--gold);color:#fff3d6}

<script>
"use strict";
/* =========================================================
   Masmorra do Corvo Rei — roguelike de cartas
   ========================================================= */
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let G=null;
const DEVOK=/dev/.test(location.hash);
const OPT=(()=>{const d={cenas:'primeira',fala:'normal',falasLuta:true,vib:true,musica:'media',efeitos:'media',bateria:'economia'};try{return Object.assign(d,JSON.parse(localStorage.getItem('trc-opt')||'{}'))}catch(e){return d}})();
/* v2.23: volumes em porcentagem (0 a 100) com barrinha. Converte as opções antigas (Desligada/Baixa/Média/Alta) sem mudar o som. */
(()=>{const old={musica:{desligada:0,baixa:25,media:50,alta:85},efeitos:{desligada:0,baixa:30,media:60,alta:100}},cl=v=>Math.max(0,Math.min(100,Math.round(+v)||0));
  if(OPT.volMusica==null)OPT.volMusica=old.musica[OPT.musica]??50;if(OPT.volEfeitos==null)OPT.volEfeitos=old.efeitos[OPT.efeitos]??60;
  if(OPT.volGeral==null)OPT.volGeral=100;if(OPT.volVideo==null)OPT.volVideo=100;delete OPT.musica;delete OPT.efeitos;
  ['volGeral','volMusica','volEfeitos','volVideo'].forEach(k=>OPT[k]=cl(OPT[k]))})();
const volPct=k=>(OPT[k]/100)*(OPT.volGeral/100);
function saveOpt(){try{localStorage.setItem('trc-opt',JSON.stringify(OPT))}catch(e){}}
const FALA_K=()=>({lenta:1.45,normal:1,rapida:.7})[OPT.fala]||1;
/* v2.19: as cinco pedras da coroa (uma por família). Ficam guardadas entre partidas. */
const PEDRA={cav:{n:'a pedra de Garrel',c:'#d8423a',quem:'aquele cavaleiro teimoso, que me arrancou a pedra de Garrel'},cac:{n:'a pedra de Ysolda',c:'#3fbf6a',quem:'aquela caçadora, que levou a irmã e a pedra de Ysolda'},
 mag:{n:'a pedra de Morvane',c:'#9a5ae0',quem:'aquele mago do livro de Morvane, que apagou a pedra do pacto'},tan:{n:'a pedra de Bram',c:'#e0a030',quem:'aquele ferreiro, que arrancou a pedra de Bram a marteladas'},
 nec:{n:'a pedra de Elowen',c:'#9fd8ff',quem:'aquele sem nome, que recusou a minha coroa e levou a pedra de Elowen'}};
function pedras(){try{return JSON.parse(localStorage.getItem('trc-pedras')||'[]').filter(k=>PEDRA[k])}catch(e){return[]}}
function addPedra(k){try{const a=pedras();if(PEDRA[k]&&!a.includes(k)){a.push(k);localStorage.setItem('trc-pedras',JSON.stringify(a))}}catch(e){}}
function listaE(a){return a.length<2?a.join(''):a.slice(0,-1).join(', ')+' e '+a[a.length-1]}
function reiStart(){const ch=G.char,a=pedras(),prev=a.filter(k=>k!==ch),resta=5-a.length;
  if(a.includes(ch))return`Você de novo? ${PEDRA[ch].n[0].toUpperCase()+PEDRA[ch].n.slice(1)} já é sua. Veio buscar o quê? Ainda me restam ${resta} pedras.`;

const SPC={};
const WKEY=['0','1','a2','a3','b2','b3'];
function wIdx(){const w=G&&G.weapon;if(!w)return 0;return w.lv<2?w.lv:(w.path==='b'?(w.lv===2?4:5):(w.lv===2?2:3))}
function heroWK(key){if(!G||!G.weapon||!CHARS[G.char]||CHARS[G.char].spr!==key)return'0';return WKEY[wIdx()]}
function sprite(key,frames=2){
  const wk=heroWK(key),id=key+'|'+frames+'|'+wk;if(SPC[id])return SPC[id];
  const g=VIS.grid(key,wk),n=g.length,cv=document.createElement('canvas');cv.width=n*frames;cv.height=n;const x=cv.getContext('2d');
  const draw=(ox,shift)=>{for(let y=n-1;y>=0;y--){const dy=shift&&y<n*.56?y+1:y;for(let i=0;i<n;i++){const c=g[y][i];if(!c)continue;x.fillStyle=c;x.fillRect(ox+i,dy,1,1)}}};
  draw(0,false);if(frames>1)draw(n,true);
  return SPC[id]=cv.toDataURL();
}
const sprHTML=(key,o={})=>`<div class="spr ${o.flip?'flip':''} ${o.fly?'fly':''}" style="background-image:url(${sprite(key)});animation-delay:-${(Math.random()*1.1).toFixed(2)}s${o.fly?',-'+(Math.random()*2).toFixed(2)+'s':''}"></div>`;

/* =========================================================
   Mapa
   ========================================================= */
const ROWS=10,COLS=7;
function genMap(){
  const rows=[...Array(ROWS)].map(()=>Array(COLS).fill(null));
  const node=(r,c)=>rows[r][c]||(rows[r][c]={r,c,type:null,next:[],jx:ri(-12,12),jy:ri(-10,10)});
  for(let p=0;p<6;p++){
    let c=p===0?ri(0,2):p===1?ri(4,6):ri(0,COLS-1);
    node(0,c);
    for(let r=0;r<ROWS-1;r++){
      const opts=[c-1,c,c+1].filter(x=>x>=0&&x<COLS).filter(n=>{if(n===c)return true;const side=rows[r][n];return!(side&&side.next.includes(c))});
      const n=pick(opts);const a=node(r,c);if(!a.next.includes(n))a.next.push(n);node(r+1,n);c=n;
    }
  }
  const parents=(r,c)=>r===0?[]:rows[r-1].filter(n=>n&&n.next.includes(c));
  for(let r=0;r<ROWS;r++)for(const n of rows[r]){if(!n)continue;
    if(r===0){n.type='luta';continue}
    if(r===4){n.type='tesouro';continue}
    if(r===6){n.type='forja';continue}
    if(r===ROWS-1){n.type='fogueira';continue}
    for(let k=0;k<20;k++){
      const x=rnd()*100;const t=x<46?'luta':x<68?'evento':x<80?'elite':x<91?'fogueira':'loja';
      if((t==='elite'||t==='fogueira')&&r<3)continue;
      if(t==='fogueira'&&r===ROWS-2)continue;
      if(t==='loja'&&r<2)continue;
      if(t!=='luta'&&t!=='evento'&&parents(r,n.c).some(p=>p.type===t))continue;
      n.type=t;break;
    }
    if(!n.type)n.type='luta';
  }
  return{rows,boss:{r:ROWS,c:3,type:'chefe',next:[],jx:0,jy:0,bid:pick(ACTS[G.act].boss)}};
}
function availNodes(){
  const m=G.map;if(UI.freeMap&&UI.dev){const all=[];m.rows.forEach(r=>r.forEach(n=>n&&all.push(n)));all.push(m.boss);return all}
  if(!G.pos)return m.rows[0].filter(Boolean);
  if(G.pos.r===ROWS)return[];
  if(G.pos.r===ROWS-1)return[m.boss];
  const cur=m.rows[G.pos.r][G.pos.c];return cur.next.map(c=>m.rows[G.pos.r+1][c]);
}
function enterNode(r,c){
  const n=r===ROWS?G.map.boss:G.map.rows[r][c];
  G.pos={r,c};G.path.push({r,c});n.done=1;G.stats.floors++;
  const A=ACTS[G.act];
  if(G.act===2&&r>=4&&r<ROWS&&!G.metLore&&n.type!=='chefe'){G.metLore=1;enterNode2(r,c,n,A);save();playIntro(null,'lore');return}
  enterNode2(r,c,n,A)}
function enterNode2(r,c,n,A){
  switch(n.type){

function spawn(id,minion){
  const c=G.combat,d=ENEMIES[id],hp=ri(d.hp[0],d.hp[1]);
  const e={uid:'e'+(++c.uidc),id,hp,maxHp:hp,block:0,st:{...(d.st||{})},turn:0,hist:[],mv:null,minion:!!minion};
  if(minion)c.enemies.unshift(e);else c.enemies.push(e);

function pickMove(e){e.turn++;const k=ENEMIES[e.id].ai(e);e.hist.push(k);e.mv=k}
function startCombat(ids,kind,quiet){
  G.combat={kind,cid:Math.floor(Math.random()*1e9),enemies:[],uidc:0,draw:shuffle(G.deck.map(c=>({...c}))),hand:[],discard:[],exhaust:[],
    energy:0,maxE:3+(hasPow('coracao')?1:0),turn:0,atkTotal:0,p:{uid:'p',block:0,st:{}},over:false};
  ids.forEach(id=>spawn(id));
  G.combat.draw.sort((a,b)=>(CARDS[b.id].inn?1:0)-(CARDS[a.id].inn?1:0));
  G.screen='combat';UI.sel=null;UI.lock=false;
  startPlayerTurn();
  const c=G.combat;
  if(hasRelic('aljavaE'))addHand('flecha',2);
  if(hasRelic('cajado'))alive().forEach(e=>apply(e,'gelo',2));
  if(hasRelic('escudoTorre'))apply(c.p,'armadura',3);
  if(hasRelic('tomo'))summon(2);
  if(hasRelic('amolar'))apply(c.p,'forca',1);
  if(hasRelic('elmo'))addBlock(8);
  if(hasRelic('calice'))alive().forEach(e=>apply(e,'sangra',3));
  if(hasRelic('ferradura'))alive().forEach(e=>apply(e,'vuln',1));
  if(hasPow('dragao'))apply(c.p,'forca',2);
  if(hasPow('egide'))addBlock(12);
  if(hasPow('espinhos'))apply(c.p,'retaliar',3);
  if(G.bonus){if(G.bonus.atk)apply(c.p,'forca',G.bonus.atk);if(G.bonus.def)apply(c.p,'destreza',G.bonus.def)}
  c.ally=G.allyNext||null;G.allyNext=null;
  G.weapon=G.weapon||{lv:0,path:null};{const e=ARMA[G.char]&&ARMA[G.char][wIdx()];if(e)e.f()}
  FXQ.length=0;
  anim('p','mv-enter');c.enemies.forEach((e,i)=>anim(e.uid,'mv-enter',i*90));
  render();c.started=true;
  if(!quiet)talkStart(kind);
  if(quiet){}else if(kind==='boss')cinematic(ENEMIES[ids[0]].n,'Chefe · '+ACTS[G.act].n);else banner(kind==='elite'?'Elite!':'Combate');
}
function startPlayerTurn(){
  const c=G.combat,p=c.p;c.turn++;
  c.pturn=true;c.cardsTurn=0;c.atkTurn=0;sfx('turno',{vol:.7});
  if(!p.st.bastiao)p.block=0;
  delete p.st.espinhos;delete p.st.esquiva;
  c.energy=c.maxE+(c.turn===1&&hasRelic('vela')?1:0);
  if(p.st.canal){c.energy+=p.st.canal;delete p.st.canal}
  if(p.st.juramento){c.energy+=p.st.juramento;loseHp(p.st.juramento)}
  tickDots(p);
  let n=5+(c.turn===1&&hasRelic('sino')?2:0)+(hasPow('mao')?1:0)+(p.st.sabedoria||0)-(p.st.enredado||0);
  delete p.st.enredado;
  draw(Math.max(0,n));
  if(p.st.instinto)addHand('flecha',p.st.instinto);
  if(p.st.danca)apply(p,'esquiva',p.st.danca);
  if(p.st.implacavel)alive().forEach(e=>apply(e,'marca',p.st.implacavel));
  if(p.st.colosso)apply(p,'armadura',p.st.colosso);
  if(p.st.marcha)summon(p.st.marcha);
  if(p.st.avatar){apply(p,'forca',p.st.avatar);apply(p,'destreza',p.st.avatar)}
}
function addHand(id,n=1,up=0){const c=G.combat;for(let i=0;i<n;i++){const k=mk(id,up);if(c.hand.length<10)c.hand.push(k);else c.discard.push(k)}}
function discardRandom(){const c=G.combat;if(!c.hand.length)return;const k=c.hand.splice(Math.floor(rnd()*c.hand.length),1)[0];c.discard.push(k);fx('p','Descartou '+CARDS[k.id].n,'st')}
function draw(n){
  const c=G.combat;if(n>0)sfx('carta-comprar',{vol:.8});
  for(let i=0;i<n;i++){
    if(c.hand.length>=10)break;
    if(!c.draw.length){if(!c.discard.length)break;c.draw=shuffle(c.discard);c.discard=[]}
    c.hand.push(c.draw.shift());
  }
}
function calcDmg(base,src,tgt){let d=base+(src.st.forca||0);if(src.st.fraco)d*=.75;if(tgt&&tgt.st.vuln)d*=1.5;return Math.max(0,Math.floor(d))}

function FO(n){if(!inC())return`<b>${n}</b>`;const f=P().st.foco||0;return`<b class="${f?'up':''}">${n+f}</b>`}
const freezeThr=e=>ENEMIES[e.id].boss?10:ENEMIES[e.id].elite?7:5;

  if(k==='gelo'&&t.uid!=='p'&&t.st.gelo>=freezeThr(t)){delete t.st.gelo;freeze(t)}
}

function loseHp(n){if(UI.god&&UI.dev)n=0;G.hp=Math.max(0,G.hp-n);if(inC()&&n>0){sfx('dano-heroi',{vol:.8});fx('p','-'+n,'dmg');const p=P();if(G.combat.pturn&&p.st.furiasangue&&G.hp>0)apply(p,'forca',p.st.furiasangue)}}
function gainGold(n,raw){if(!raw){if(hasRelic('bolsa'))n*=1.3;if(hasPow('tesouro'))n*=1.5}G.gold+=Math.round(n);if(n>0)sfx('moedas',{gap:200})}

function tickDots(u){
  for(const k of['sangra','queima']){
    const n=u.st[k];if(!n)continue;
    if(u.uid==='p')loseHp(n);else{u.hp=Math.max(0,u.hp-n);fx(u.uid,'-'+n,'dmg');G.stats.dmg+=n;if(u.hp<=0)onEnemyDeath(u)}
    if(k==='sangra')dec(u,k);else{u.st.queima=Math.floor(n/2);if(!u.st.queima)delete u.st.queima}
  }
}
function dealDamage(t,d,i=0,pierce=false){
  if(t.st.intangivel)d=Math.min(d,1);
  const blk=pierce?0:Math.min(t.block,d);t.block-=blk;const un=d-blk;
  t.hp=Math.max(0,t.hp-un);
  fx(t.uid,un>0?'-'+un:'Bloqueado',un>0?'dmg':'blk',i);
  G.stats.dmg+=un;
  if(un>0&&t.hp>0)talkFoe(t,'hurt',.22,{delay:300});
  if(un>0&&t.hp>0&&t.st.enfurecer)apply(t,'forca',t.st.enfurecer);
  if(t.hp<=0)sfx('inimigo-morre',{delay:120});
  if(t.hp<=0)onEnemyDeath(t);
  return un;
}
function hit(t,base,times=1,mult=1,pierce=false){
  if(!t)return false;
  for(let i=0;i<times;i++){
    if(t.hp<=0)break;
    const d=calcDmg(base+(t.st.marca||0),P(),t)*mult;
    const un=dealDamage(t,d,i,pierce);
    if(un>0&&P().st.serrilhada&&t.hp>0)t.st.sangra=(t.st.sangra||0)+P().st.serrilhada;
  }
  return t.hp<=0;
}
function hitAll(base,times=1){for(let i=0;i<times;i++)alive().forEach(e=>hit(e,base))}
function enemyHit(e,base,i){
  const p=P();if(G.hp<=0||e.hp<=0)return;
  if(p.st.esquiva){dec(p,'esquiva');fx('p','Esquivou!','blk',i);anim('p','mv-dodge',i*170);return}
  const d=calcDmg(base,e,p);const blk=Math.min(p.block,d);p.block-=blk;let un=d-blk;
  if(p.st.servos&&d>0&&rnd()<.25){p.block+=blk;servoDie(false);fx('p','Mirou no servo','bad',i);return}
  if(un>0&&p.st.servos){servoDie(false);un=0;fx('p','Servo protegeu','st',i)}
  if(UI.god&&UI.dev)un=0;
  G.hp=Math.max(0,G.hp-un);
  {const bs=ENEMIES[e.id]&&ENEMIES[e.id].boss;if(un>0){sfx(bs?'golpe-pesado':'dano-heroi',{delay:i*170,gap:30});if(bs)sfx('dano-heroi',{delay:i*170+60,vol:.6,gap:30})}else if(blk>0)sfx('bloqueio',{delay:i*170,gap:30})}
  if(un>0){talkHero('hurt',.3,{delay:300});checkLow();vib(un>=12?[50,30,60]:35)}
  if(un>0||blk>0)fx('p',un>0?'-'+un:'Bloqueado',un>0?'dmg':'blk',i);
  if(un>0&&p.st.armadura&&!p.st.armViva)dec(p,'armadura');
  if(un>0&&e.st.vampiro)healE(e,un);
  if(p.st.espinhos)dealDamage(e,p.st.espinhos);
  if(p.st.retaliar&&e.hp>0)dealDamage(e,p.st.retaliar);
}
function summon(n){const p=P(),cur=p.st.servos||0,add=Math.min(n,6-cur);if(add<=0){fx('p','Máximo de servos','st');return}p.st.servos=cur+add;p.sk=p.sk||[];for(let i=0;i<add;i++)p.sk.push(nextServoKind());UI.newServo+=add;fx('p','+'+add+' Servo'+(add>1?'s':''),'st')}
function nextServoKind(){const K=G.kills||[],c=G.combat;if(!K.length)return'esqueleto';c.sumIdx=c.sumIdx||0;const id=K[K.length-1-(c.sumIdx%K.length)];c.sumIdx++;return ENEMIES[id]?id:'esqueleto'}
function servoDie(sac){const p=P();if(!p.st.servos)return false;p.st.servos--;if(p.sk&&p.sk.length)p.sk.shift();if(!p.st.servos)delete p.st.servos;fx('p',sac?'Servo sacrificado':'Servo destruído','bad');if(p.st.sifao)heal(p.st.sifao);return true}
function servosAttack(){

function onEnemyDeath(e){

function revive(e){e.hp=Math.floor(e.maxHp/2);e.dead=0;e.revive=0;e.st={};e.hist=[];fx(e.uid,'Remontou!','st');anim(e.uid,'mv-summon');pickMove(e)}
function canPlay(card){

function playerAttackFx(d,v,t){

  if(d.t==='atk'){
    const tg=d.tg==='e'?[t]:alive();
    if(style==='melee'&&!d.fxk){anim('p','mv-lunge');tg.forEach(x=>slash(x.uid,150));FXB=150}
    else{anim('p',style==='arrow'?'mv-shoot':'mv-cast');const k=d.fxk||{melee:'bolt',arrow:'arrow',bolt:'bolt',dark:'dark'}[style];tg.forEach((x,j)=>proj('p',x.uid,k,j*40));FXB=270}

function playCard(uid,tUid){
  const c=G.combat;if(!c||UI.lock||c.over)return;
  const idx=c.hand.findIndex(k=>k.uid===uid);if(idx<0)return;
  const card=c.hand[idx],d=CARDS[card.id];
  const[ok,why]=canPlay(card);if(!ok){toast(why);UI.sel=null;render();return}
  let t=null;
  if(d.tg==='e'){t=alive().find(e=>e.uid===tUid);if(!t){const a=alive();if(a.length===1)t=a[0];else{UI.sel={card:uid};render();return}}}
  const cost=cardCost(card);let x=0;
  if(cost==='X'){x=c.energy;c.energy=0}else c.energy-=cost;
  c.hand.splice(idx,1);
  const v=vals(card);v.x=x;
  playerAttackFx(d,v,t);
  d.p(v,t,card);
  if(d.t==='atk'&&P().st.eco&&!(c.atkTurn||0)){
    let t2=t;if(d.tg==='e'&&(!t2||t2.hp<=0)){const a=alive();t2=a.length?pick(a):null}
    if(!d.tg||t2){FXB+=300;if(t2)proj('p',t2.uid,d.fxk||'bolt',300);fx('p','Eco!','st');d.p(v,t2,card)}
  }

  if(d.t==='atk'&&alive().length)talkHero('atk',.28,{delay:250});
  if(d.t==='atk'){c.atkTotal++;c.atkTurn=(c.atkTurn||0)+1;if(P().st.ritmo)addBlock(P().st.ritmo);if(hasRelic('tambor')&&c.atkTotal%3===0)gainEnergy(1)}

  if(d.t!=='pwr'){if(d.ex)c.exhaust.push(card);else c.discard.push(card)}
  UI.sel=null;G.stats.cards++;setTimeout(()=>tutEvent('play',d.t),0);
  render();checkEnd();
}
function checkEnd(){
  const c=G.combat;if(!c||c.over)return true;
  if(G.hp<=0){
    if(hasPow('fenix')&&!G.fenixUsed){G.fenixUsed=1;G.hp=Math.floor(G.maxHp/2);fx('p','Renascido!','heal');anim('p','mv-summon');render();return false}
    c.over=true;UI.lock=true;setTimeout(()=>{UI.lock=false;G.screen='end';G.won=false;clearSave();render();playIntro(null,'death')},1000);return true;
  }
  if(!alive().length&&!c.enemies.some(e=>e.revive)){c.over=true;UI.lock=true;anim('p','mv-victory',500);talkHero('win',.85,{prio:2,delay:650});render();setTimeout(()=>{UI.lock=false;winCombat()},1300);return true}
  return false;
}
function doMove(e,mv){
  if(mv.d){
    talkFoe(e,'atk',.3);
    if(mv.pj){anim(e.uid,'mv-cast');proj(e.uid,'p',mv.pj);FXB=270}else{anim(e.uid,'mv-lunge');FXB=150}
    for(let i=0;i<(mv.h||1);i++)enemyHit(e,mv.d,i);
  }else if(mv.i==='debuff'){anim(e.uid,'mv-cast');proj(e.uid,'p',mv.pj||'hex');FXB=270}
  else if(mv.i==='sum')anim(e.uid,'mv-cast');
  else if(mv.i.includes('buff'))anim(e.uid,'mv-buff');
  else if(mv.i==='def')anim(e.uid,'mv-block');
  if(mv.b){e.block+=mv.b;fx(e.uid,'+'+mv.b,'blk')}
  if(mv.f)mv.f(e);
  FXB=0;
}
async function endTurn(){
  const c=G.combat;if(!c||UI.lock||c.over)return;
  UI.lock=true;UI.sel=null;const p=c.p;tutEvent('end');sfx('turno',{vol:.5,rate:.84});

  if(p.st.servos)servosAttack();
  if(c.ally&&WARR[c.ally]){const a=alive();if(a.length){const W=WARR[c.ally],e=pick(a),dm=3+2*G.act;FXB=400;
    if(W.atk==='melee'){anim('ally','mv-lunge',400);slash(e.uid,550);FXB=550}else{anim('ally',W.atk==='arrow'?'mv-shoot':'mv-cast',400);proj('ally',e.uid,W.atk==='arrow'?'arrow':'bolt',400);FXB=670}
    dealDamage(e,dm);FXB=0}}
  if(p.st.bradoT){apply(p,'forca',-p.st.bradoT);delete p.st.bradoT}
  const keep=[];
  c.hand.forEach(k=>{const d=CARDS[k.id];if(d.ret)keep.push(k);else if(d.eph)c.exhaust.push(k);else c.discard.push(k)});
  c.hand=keep;c.pturn=false;
  dec(p,'fraco');dec(p,'vuln');
  render();if(checkEnd())return;
  await enemyPhase(c);
}
async function enemyPhase(c){
  UI.lock=true;
  await sleep(550);banner('Turno inimigo',true);await sleep(400);
  for(const e of[...c.enemies]){
    if(G.combat!==c)return;
    if(e.hp<=0&&e.revive){revive(e);render();await sleep(600);continue}
    if(e.hp<=0)continue;
    e.block=0;delete e.st.intangivel;tickDots(e);
    if(e.hp<=0){render();await sleep(350);continue}
    if(e.st.congelado){delete e.st.congelado;fx(e.uid,'Congelado!','blk');anim(e.uid,'mv-freeze');render();await sleep(500);continue}
    const mv=ENEMIES[e.id].moves[e.mv];
    doMove(e,mv);
    render();await sleep(mv.d?700+(mv.h||1)*90:560);
    if(G.hp<=0&&checkEnd())return;
  }
  if(G.combat!==c)return;
  c.enemies=c.enemies.filter(e=>e.hp>0||e.revive);
  for(const e of alive()){dec(e,'fraco');dec(e,'vuln');if(e.st.ritual)apply(e,'forca',e.st.ritual);if(e.st.pedra)e.block+=e.st.pedra;pickMove(e)}
  if(checkEnd())return;
  startPlayerTurn();UI.lock=false;render();
  if(!checkEnd())banner('Seu turno',true);
}
/* jogo salvo no meio da vitória, da derrota ou do turno inimigo: retoma de onde parou */
function resumeCombat(){
  const c=G&&G.combat;if(!c||G.screen!=='combat')return;
  if(c.over){c.over=false;UI.lock=false;checkEnd();return}
  if(!c.pturn)enemyPhase(c);
}
function winCombat(){
  const kind=G.combat.kind,bossE=kind==='boss'&&G.combat.enemies.find(e=>ENEMIES[e.id].boss),bid=bossE&&bossE.id;
  if(hasRelic('brasao'))heal(6);
  G.combat=null;
  {const fr=kind==='boss'?2:kind==='elite'?1:0;if(fr)G.frags=(G.frags||0)+fr}
  if(kind==='boss'){G.stats.bosses++;G.diamonds+=3;if(G.act>=3){G.pedrasAntes=pedras();addPedra(G.char);G.screen='end';G.won=true;clearSave();render();playIntro(()=>playIntro(()=>render(),'ending'),'bfall:'+bid);return}}
  G.reward=makeReward(kind);G.screen='reward';
  if(G.war&&G.war.mode==='fight'&&G.war.phase==='after'&&kind!=='boss')G.screen='warrior';
  render();

}
function usePotion(i,tUid){
  const id=G.potions[i];if(!id)return;const d=POTIONS[id];

function rollRarity(kind){const x=rnd()*100;if(kind==='boss')return x<45?'rare':'unc';if(kind==='elite')return x<12?'rare':x<52?'unc':'common';return x<4?'rare':x<38?'unc':'common'}
function cardChoices(kind,n=3){const out=[];let guard=0;while(out.length<n&&guard++<200){const r=rollRarity(kind);const pool=Object.keys(CARDS).filter(k=>CARDS[k].r===r&&clOf(k)===G.char&&!out.includes(k));if(pool.length)out.push(pick(pool))}return out}
function makeReward(kind){
  let gold=kind==='boss'?ri(90,110):kind==='elite'?ri(25,35):ri(10,20);
  if(hasRelic('bolsa'))gold*=1.3;if(hasPow('tesouro'))gold*=1.5;
  return{kind,gold:Math.round(gold),dia:kind==='boss'?3:0,frag:kind==='boss'?2:kind==='elite'?1:0,pot:rnd()<(kind==='normal'?.4:.6)?pick(Object.keys(POTIONS)):null,relic:kind!=='normal'?randRelic():null,cards:cardChoices(kind).map(id=>mk(id,G.stats.floors>6&&rnd()<.12?1:0)),taken:{}};
}
function randRelic(){const pool=Object.keys(RELICS).filter(k=>!RELICS[k].start&&!G.relics.includes(k));return pool.length?pick(pool):null}
function gainRelic(k){if(!k||G.relics.includes(k))return;G.relics.push(k);if(k==='anel'){G.maxHp+=10;G.hp+=10}if(k==='cinto')G.potions.push(null)}

function gainPotion(id){const i=G.potions.indexOf(null);if(i<0)return false;G.potions[i]=id;return true}
function addToDeck(id,up=0){G.deck.push(mk(id,up))}
function powerOffers(n){return shuffle(Object.keys(POWERS).filter(k=>POWERS[k].rep||!hasPow(k))).slice(0,n)}
function makeShop(){
  const disc=hasPow('tesouro')?.75:1;
  const price=r=>Math.round({common:ri(45,55),unc:ri(68,82),rare:ri(135,160)}[r]*disc);
  const ids=[...cardChoices('normal',3),...cardChoices('elite',2)].filter((v,i,a)=>a.indexOf(v)===i);

  const pw=powerOffers(1)[0];
  return{cards:ids.map(id=>({card:mk(id),price:price(CARDS[id].r),sold:0})),relics:rel.map(k=>({id:k,price:Math.round(ri(140,170)*disc),sold:0})),pots:[pick(Object.keys(POTIONS)),pick(Object.keys(POTIONS))].map(id=>({id,price:Math.round(ri(45,60)*disc),sold:0})),power:pw?{id:pw,sold:0}:null,removeUsed:false,removePrice:Math.round(75*disc)};

/* ---------- efeitos visuais ---------- */
const FXQ=[];let FXB=0;
const MVS=['mv-lunge','mv-shoot','mv-cast','mv-hit','mv-block','mv-buff','mv-heal','mv-dodge','mv-summon','mv-enter','mv-freeze','mv-victory'];
function fx(uid,text,cls,i=0){
  FXQ.push({k:'t',uid,text,cls,delay:FXB+i*170+FXQ.filter(f=>f.k==='t'&&f.uid===uid).length*60});
  if(cls==='dmg')anim(uid,'mv-hit',i*170);else if(text==='Bloqueado')anim(uid,'mv-block',i*170);
}
function anim(uid,cls,d=0){FXQ.push({k:'a',uid,cls,delay:FXB+d})}
function proj(from,to,kind,d=0){FXQ.push({k:'p',from,to,kind,delay:d})}
function slash(uid,d=150){FXQ.push({k:'s',uid,delay:d})}
const center=uid=>{const el=document.querySelector(`[data-uid="${uid}"] .fig`);if(!el)return null;const r=el.getBoundingClientRect();return[r.left+r.width/2,r.top+r.height*.5,r]};
const BURST={arrow:'#e8dcc0',bolt:'#7fd0ff',fire:'#ffb030',ice:'#d8f4ff',dark:'#b56ae0',hex:'#d06ae0',web:'#ffffff',bone:'#e0d8c2',beam:'#ff5af0'};
function burstAt(x,y,col){const b=document.createElement('div');b.className='burst';b.style.left=x+'px';b.style.top=y+'px';b.style.setProperty('--bc',col);$('#fxlayer').appendChild(b);setTimeout(()=>b.remove(),400)}
function runFx(f){
  const L=$('#fxlayer');
  if(f.k==='t'){const c=center(f.uid);if(!c)return;const d=document.createElement('div');d.className='float '+f.cls;d.textContent=f.text;d.style.left=(c[0]+(Math.random()*36-18))+'px';d.style.top=(c[2].top+c[2].height*.25)+'px';L.appendChild(d);setTimeout(()=>d.remove(),1100)}
  else if(f.k==='a'){const el=document.querySelector(`[data-uid="${f.uid}"] .fig`);if(!el)return;el.classList.remove(...MVS);void el.offsetWidth;el.classList.add(f.cls);const h=e=>{if(e.target!==el)return;el.classList.remove(f.cls);el.removeEventListener('animationend',h)};el.addEventListener('animationend',h)}
  else if(f.k==='p'){const a=center(f.from),b=center(f.to);if(!a||!b)return;const d=document.createElement('div');d.className='proj '+f.kind;const ang=Math.atan2(b[1]-a[1],b[0]-a[0])*180/Math.PI;
    d.style.transform=`translate(${a[0]}px,${a[1]}px) rotate(${ang}deg)`;L.appendChild(d);
    requestAnimationFrame(()=>requestAnimationFrame(()=>{d.style.transform=`translate(${b[0]}px,${b[1]}px) rotate(${ang}deg)`}));
    setTimeout(()=>{d.remove();burstAt(b[0],b[1],BURST[f.kind]||'#fff')},270)}
  else if(f.k==='s'){const c=center(f.uid);if(!c)return;const d=document.createElement('div');d.className='slash';d.style.left=c[0]+'px';d.style.top=c[1]+'px';L.appendChild(d);setTimeout(()=>d.remove(),360)}
}
function flushFx(){FXQ.splice(0).forEach(f=>setTimeout(()=>runFx(f),f.delay))}
function banner(t,small){const d=document.createElement('div');d.className='banner';if(small)d.style.fontSize='34px';d.textContent=t;$('#fxlayer').appendChild(d);setTimeout(()=>d.remove(),1150)}
function cinematic(name,sub){const d=document.createElement('div');d.className='cine';d.innerHTML=`<div class="cn"></div><div class="cs"></div>`;d.querySelector('.cn').textContent=name;d.querySelector('.cs').textContent=sub;$('#fxlayer').appendChild(d);setTimeout(()=>d.remove(),2900)}

function devCardMenu(src,i){
  const c=G.combat;let card,list;
  if(src==='lib')card={uid:'x',id:i,up:0};else{list=src==='deck'?G.deck:c[src];card=list[+i]}
  if(!card)return;
  const acts=[];
  if(src==='lib'){
    acts.push(['Adicionar ao baralho',()=>addToDeck(card.id)],['Adicionar melhorada',()=>addToDeck(card.id,1)]);
    if(c)acts.push(['Para a mão (só neste combate)',()=>{if(c.hand.length<10)c.hand.push(mk(card.id))}],['Para o topo da compra',()=>c.draw.unshift(mk(card.id))]);
  }else{
    if(canUp(card))acts.push(['Melhorar',()=>{card.up=1;const dk=G.deck.find(x=>x.uid===card.uid);if(dk)dk.up=1}]);
    else if(card.up)acts.push(['Desfazer melhoria',()=>{card.up=0;const dk=G.deck.find(x=>x.uid===card.uid);if(dk)dk.up=0}]);
    if(c&&src!=='hand')acts.push(['Mover para a mão',()=>{if(c.hand.length<10){list.splice(+i,1);c.hand.push(card)}}]);
    if(c&&src!=='draw')acts.push(['Mover para o topo da compra',()=>{list.splice(+i,1);c.draw.unshift(card)}]);
    if(src==='deck')acts.push(['Remover do baralho',()=>G.deck.splice(+i,1)]);
    else acts.push(['Exaurir',()=>{list.splice(+i,1);c.exhaust.push(card)}]);
    acts.push(['Duplicar no baralho',()=>addToDeck(card.id,card.up)]);
  }
  UI.devActs=acts;
  const m=$('#modal');
  m.innerHTML=`<div class="mbox" style="max-width:420px">${cardHTML(card,{cls:'big'})}<div class="panel">${acts.map((a,k)=>`<button class="choice" data-act="devdo" data-k="${k}"><b>${a[0]}</b></button>`).join('')}<button class="btn small" data-act="mclose">Cancelar</button></div></div>`;

}

    chest:()=>go(()=>{G.screen='treasure';G.chest=null}),tomap:()=>go(()=>{G.screen='map'}),

let drag=null;
document.addEventListener('pointerdown',e=>{
  const el=e.target.closest('#hand .card');if(!el||UI.lock||e.button>0)return;
  const r=el.getBoundingClientRect();
  drag={el,uid:el.dataset.cuid,sx:e.clientX,sy:e.clientY,ox:e.clientX-r.left,oy:e.clientY-r.top,moved:false,tgt:null};
});
window.addEventListener('pointermove',e=>{
  if(!drag)return;
  if(!drag.moved&&Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>8){drag.moved=true;drag.el.classList.add('dragging');$('#tip').hidden=true}
  if(!drag.moved)return;
  drag.el.style.left=(e.clientX-drag.ox)+'px';drag.el.style.top=(e.clientY-drag.oy)+'px';drag.el.style.bottom='auto';
  const card=G.combat.hand.find(k=>k.uid===drag.uid);if(!card)return;
  if(CARDS[card.id].tg==='e'){
    const u=document.elementFromPoint(e.clientX,e.clientY)?.closest('.unit.enemy:not(.dead)');
    document.querySelectorAll('.unit.tgt').forEach(x=>x!==u&&x.classList.remove('tgt'));
    if(u)u.classList.add('tgt');drag.tgt=u?u.dataset.uid:null;
  }
});
window.addEventListener('pointerup',e=>{
  if(!drag)return;const d=drag;drag=null;
  if(UI.lpShown&&!d.moved){d.el.classList.remove('dragging');return}
  const card=G&&G.combat&&G.combat.hand.find(k=>k.uid===d.uid);if(!card){render();return}
  const def=CARDS[card.id];
  document.querySelectorAll('.unit.tgt').forEach(x=>x.classList.remove('tgt'));
  if(!d.moved){
    if(UI.sel&&UI.sel.card===d.uid&&def.tg!=='e')playCard(d.uid);
    else if(UI.sel&&UI.sel.card===d.uid){UI.sel=null;render()}
    else{UI.sel={card:d.uid};render()}
    return;
  }
  const handTop=$('#hand').getBoundingClientRect().top;
  if(def.tg==='e'){if(d.tgt)playCard(d.uid,d.tgt);else if(alive().length===1&&e.clientY<handTop-30)playCard(d.uid);else render()}
  else if(e.clientY<handTop-30)playCard(d.uid);
  else render();
});
window.addEventListener('pointercancel',()=>{if(drag){drag=null;render()}});

/* =========================================================
   Cenário vivo: parede de pedra, tochas, janela com lua e corvos
   (canvas em baixa resolução, ampliado em pixel art; não usa o RNG do jogo)
   ========================================================= */
const BG={mode:'',act:0,wall:null,W:0,H:0,last:0,embers:[],crows:[],big:null,stars:null,win:null,drawn:false,rm:false};
const BGPX=3;
const BGPAL={0:[54,46,40],1:[62,50,39],2:[46,52,60],3:[64,40,35]};
function lcg(s){s=s>>>0;return()=>(s=(Math.imul(s,1664525)+1013904223)>>>0)/4294967296}
function bgInit(){
  const cv=$('#bg');if(!cv)return;BG.cv=cv;BG.x=cv.getContext('2d');
  try{BG.rm=matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){}
  bgResize();addEventListener('resize',()=>{bgResize();bgDraw(performance.now(),true)});
  addEventListener('scroll',()=>{if(BG.rm)bgDraw(performance.now(),true)},true);
  requestAnimationFrame(bgLoop);
}
function bgResize(){if(!BG.cv)return;BG.W=BG.cv.width=Math.ceil(innerWidth/BGPX);BG.H=BG.cv.height=Math.ceil(innerHeight/BGPX);BG.wall=null;BG.stars=null}
function bgSet(mode,act){if(!BG.cv)return;if(mode===BG.mode&&act===BG.act){if(BG.rm)requestAnimationFrame(()=>bgDraw(performance.now(),true));return}BG.mode=mode;BG.act=act;BG.wall=null;BG.embers.length=0;requestAnimationFrame(()=>bgDraw(performance.now(),true))}
const bgStep=()=>({normal:33,economia:66,maxima:0})[OPT.bateria]??66;
function bgLoop(t){requestAnimationFrame(bgLoop);const st=bgStep();if(document.hidden||BG.rm||!BG.mode||!st||(typeof CUT!=='undefined'&&CUT.on))return;if(t-BG.last<st)return;BG.k=Math.min(3,(t-BG.last)/33);BG.last=t;bgDraw(t)}

function buildWall(){
  const W=BG.W,H=BG.H,o=document.createElement('canvas');o.width=W;o.height=H;const x=o.getContext('2d');
  const key=BG.mode==='title'?0:BG.act,r=lcg(7+key*101),[R,Gc,Bc]=BGPAL[key]||BGPAL[1];
  x.fillStyle=`rgb(${R*.32|0},${Gc*.32|0},${Bc*.32|0})`;x.fillRect(0,0,W,H);
  const bw=18,bh=9;
  for(let row=0,y=0;y<H;row++,y+=bh){
    const off=row%2?bw/2:0;
    for(let bx=-off;bx<W;bx+=bw){
      const j=.74+r()*.42,c=k=>Math.min(255,k*j|0);
      x.fillStyle=`rgb(${c(R)},${c(Gc)},${c(Bc)})`;x.fillRect(bx+1,y+1,bw-1,bh-1);

    for(let y=0;y<top;y++)for(let i=0;i<n;i++){const v=g[y][i];if(v){const yy=y+bob;if(yy>=0&&yy<n)o[yy][i]=v}}

    const wx=a.x+(a.flip?-1:1)*((i+.5)*sz/n-sz/2),wy=a.y-sz+(j+.5)*sz/n,c=color&&Math.random()<.5?color:`rgb(${d[k]},${d[k+1]},${d[k+2]})`;

/* ---------- abertura em vídeo ---------- */
function openAbertura(play){
  const a=$('#abert'),v=$('#abv');if(!a||!v)return;
  a.hidden=false;a.classList.remove('out');$('#abstart').hidden=!!play;$('#abskip').hidden=!play;
  try{v.currentTime=0}catch(e){}v.volume=vidVol();v.muted=vidVol()===0;
  MUS.hold=true;musApply();
  if(play)v.play().catch(()=>{$('#abstart').hidden=false;$('#abskip').hidden=true});
}
function closeAbertura(){
  const a=$('#abert'),v=$('#abv');if(!a||a.hidden)return;
  try{localStorage.setItem('trc-abertura','1')}catch(e){}
  a.classList.add('out');setTimeout(()=>{a.hidden=true;try{v.pause()}catch(e){}},800);MUS.hold=false;MUS.unlocked=true;musApply();
}
(function(){
  const v=$('#abv');if(!v)return;
  $('#abplay').onclick=()=>{v.volume=vidVol();v.muted=vidVol()===0;$('#abstart').hidden=true;$('#abskip').hidden=false;v.play().catch(()=>closeAbertura())};
  $('#abno').onclick=closeAbertura;$('#abskip').onclick=closeAbertura;
  v.addEventListener('ended',closeAbertura);v.addEventListener('error',closeAbertura);
  document.addEventListener('keydown',e=>{if(!$('#abert').hidden&&e.key==='Escape'){e.stopImmediatePropagation();closeAbertura()}},true);
})();

/* ---------- início ---------- */
window.claude?.hot?.snapshot?.(()=>({G,dev:UI.dev,devOpen:UI.devOpen}));
function boot(data){
  if(data&&data.G&&data.G.act){G=data.G;UI.dev=!!data.dev;UI.devOpen=!!data.devOpen;UI.lock=false}
  bgInit();render();resumeCombat();
  if('serviceWorker' in navigator&&/github\.io$/.test(location.hostname))navigator.serviceWorker.register('sw.js').catch(()=>{});
  VIS.sceneLoad().then(()=>{const a=['entrada','taverna','mina','goblins','esgoto','aranhas','forjaHef','catacumbas','cripta','carrasco','pantano','salao','santuario'];VIS.sceneWarm(a.concat(VIS.sceneNames().filter(k=>!a.includes(k))))});
  let seen=false;try{seen=localStorage.getItem('trc-abertura')==='1'}catch(e){}
  if(!seen&&!(data&&data.G))openAbertura(false);
}
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
