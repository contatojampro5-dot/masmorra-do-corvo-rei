<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Espadas do Cavaleiro</title>
<style>:root{--bg:#120d0a;--card:#1e1610;--line:#4a3a28;--ouro:#e8c25a;--txt:#e8d9b8}body{margin:0;background:var(--bg);color:var(--txt);font:14px Georgia,serif}
header{padding:14px 16px 4px}h1{margin:0;color:var(--ouro);font-size:22px}header p{margin:4px 0 0;opacity:.75}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;padding:10px 16px 20px}.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px}
.card h2{margin:0;font-size:16px;color:var(--ouro)}.card .cam{font-size:12px;opacity:.7;margin:2px 0 6px}.card canvas{width:100%;image-rendering:pixelated;border-radius:6px;display:block}.card p{margin:6px 0 0;font-size:13px;opacity:.85}
.bar{display:flex;gap:6px;padding:4px 16px}.bar button{background:#2c2016;color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:5px 9px;font:13px Georgia}.bar button.on{background:#5a3a1a;border-color:var(--ouro)}</style></head><body>
<header><h1>Espadas evolutivas do Cavaleiro</h1><p>As 6 armas da forja do Hefesto, cada uma com o seu risco, as suas faíscas e o seu brilho.</p></header>
<div class="bar"><button data-ato="1" class="on">Ato 1</button><button data-ato="2">Ato 2</button><button data-ato="3">Ato 3</button></div>
<div class="grid" id="g"></div>
<script src="rig.js"></script><script src="poses.js"></script><script>
const LUZ={1:{dir:-1,col:[255,160,70],amb:[60,40,40]},2:{dir:1,col:[140,210,255],amb:[40,60,60]},3:{dir:-1,col:[255,90,50],amb:[90,40,120]}};
const FUNDO={1:['#2a1a10','#3a2618'],2:['#101a1e','#1a2a2e'],3:['#24101a','#3a1a24']};
const CAM=['Nível I','Nível II','Caminho do Fogo · III','Caminho do Fogo · IV','Caminho das Sombras · III','Caminho das Sombras · IV'];
const TXT=['Aço comum, bem cuidado.','O aço escureceu com o sangue dos inimigos.','Brasas acendem no fio da lâmina.','Preta e pegando fogo. Não se apaga.','Runas roxas acordam no aço negro.','Engole a luz em volta dela.'];
let ato=1;const R=makeRig(),K=6,PAR=vivo('parado'),GOL=vivo('golpe');const cards=[];
ESPADAS.forEach((E,i)=>{const d=document.createElement('div');d.className='card';d.innerHTML=`<h2>${E.n}</h2><div class="cam">${CAM[i]}</div><canvas width="${56*K}" height="${64*K}"></canvas><p>${TXT[i]}</p>`;document.getElementById('g').appendChild(d);
  cards.push({i,cv:d.querySelector('canvas'),anim:'parado',f:0,t:0,trail:[],fx:[],cache:{},prox:2500+i*400})});
document.querySelectorAll('[data-ato]').forEach(b=>b.onclick=()=>{ato=+b.dataset.ato;document.querySelectorAll('[data-ato]').forEach(x=>x.classList.toggle('on',x===b));cards.forEach(c=>c.cache={})});
function quadro(c,pose,key){let e=c.cache[key];if(e)return e;const img=lightPass(R.draw({...pose,esp:c.i}),LUZ[ato]);e=c.cache[key]={img,hand:R.info.hand.slice(),tip:R.info.tip.slice()};return e}
let last=performance.now(),T0=last;
function loop(t){const dt=Math.min(80,t-last);last=t;
  for(const c of cards){const seq=c.anim==='parado'?PAR:GOL,fps=c.anim==='parado'?12:14;c.t+=dt;c.prox-=dt;
    while(c.t>=1000/fps){c.t-=1000/fps;c.f++;if(c.anim==='golpe'&&c.f===7){const E=ESPADAS[c.i];for(let k=0;k<14;k++){const a=Math.random()*6.28,v=.4+Math.random()*1.3;c.fx.push({x:36,y:34,vx:Math.cos(a)*v+.6,vy:Math.sin(a)*v-.5,l:16+Math.random()*10,col:k%3?E.faisca:'#ffffff'})}}
      if(c.f>=seq.length){c.f=0;if(c.anim==='golpe'){c.anim='parado';c.prox=3200}}}
    if(c.anim==='parado'&&c.prox<=0){c.anim='golpe';c.f=0;c.t=0}
    const pose=(c.anim==='parado'?PAR:GOL)[c.f],e=quadro(c,pose,c.anim+c.f),x=c.cv.getContext('2d');x.imageSmoothingEnabled=false;
    const L=document.createElement('canvas');L.width=56;L.height=64;const l=L.getContext('2d');const F=FUNDO[ato];l.fillStyle=F[0];l.fillRect(0,0,56,64);l.fillStyle=F[1];l.fillRect(0,61,56,3);
    l.drawImage(e.img,4,0);
    // risco do golpe seguindo a ponta
    if(c.anim==='golpe'&&c.f>=5&&c.f<=8)c.trail.push({h:[e.hand[0]+4,e.hand[1]],tp:[e.tip[0]+4,e.tip[1]],a:1});
    c.trail.forEach(q=>q.a-=.12);c.trail=c.trail.filter(q=>q.a>0);const E=ESPADAS[c.i];
    for(let k=1;k<c.trail.length;k++){const A=c.trail[k-1],B=c.trail[k];for(let u=0;u<=1;u+=.2)for(let v=.45;v<=1;v+=.14){const ax=A.h[0]+(A.tp[0]-A.h[0])*v,ay=A.h[1]+(A.tp[1]-A.h[1])*v,bx=B.h[0]+(B.tp[0]-B.h[0])*v,by=B.h[1]+(B.tp[1]-B.h[1])*v;
      l.globalAlpha=B.a*(v>.85?1:.55);l.fillStyle=v>.85?(E.fx==='vazio'?'#e8d8ff':'#ffffff'):(E.fx==='vazio'?'#1a0a30':E.risco);l.fillRect(Math.round(ax+(bx-ax)*u),Math.round(ay+(by-ay)*u),1,1);if(E.fx==='vazio'&&v<.6){l.fillStyle=E.risco;l.fillRect(Math.round(ax+(bx-ax)*u),Math.round(ay+(by-ay)*u)-1,1,1)}}}
    l.globalAlpha=1;l.save();l.translate(4,0);brilhoEspada(l,e,c.i,t-T0);l.restore();
    if((E.fx==='chamas'||E.fx==='brasas')&&c.anim==='golpe'&&Math.random()<.6)c.fx.push({x:e.tip[0]+4,y:e.tip[1],vx:(Math.random()-.5)*.6,vy:-.3-Math.random()*.6,l:14,col:Math.random()<.5?'#ffb040':'#ff6a1a'});
    if(E.fx==='vazio'&&c.anim==='golpe'&&Math.random()<.6)c.fx.push({x:e.tip[0]+4+(Math.random()-.5)*10,y:e.tip[1]+(Math.random()-.5)*10,vx:0,vy:0,l:12,col:'#7a4ae0',alvo:[e.tip[0]+4,e.tip[1]]});
    c.fx=c.fx.filter(p=>p.l-->0);for(const p of c.fx){if(p.alvo){p.x+=(p.alvo[0]-p.x)*.2;p.y+=(p.alvo[1]-p.y)*.2}else{p.x+=p.vx;p.y+=p.vy;p.vy+=.06}l.globalAlpha=Math.min(1,p.l/8);l.fillStyle=p.col;l.fillRect(Math.round(p.x),Math.round(p.y),1,1)}l.globalAlpha=1;
    x.drawImage(L,0,0,56*K,64*K)}
  requestAnimationFrame(loop)}
requestAnimationFrame(loop);document.title='Espadas do Cavaleiro';
</script></body></html>
