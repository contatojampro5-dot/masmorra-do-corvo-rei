<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#0b0705;overflow:hidden}canvas{display:block;image-rendering:pixelated}#t{position:fixed;top:14px;left:0;right:0;text-align:center;font:600 20px Georgia;color:#e8c27a;letter-spacing:.12em;text-shadow:0 2px 6px #000}</style></head><body><canvas id="c" width="240" height="135"></canvas><div id="t"></div>
<script src="rig.js"></script><script src="poses.js"></script><script>
const C=document.getElementById('c'),X=C.getContext('2d');C.style.width=innerWidth+'px';C.style.height=innerHeight+'px';const R=makeRig();
const cp=c=>{const o=document.createElement('canvas');o.width=c.width;o.height=c.height;o.getContext('2d').drawImage(c,0,0);return o};
const SEQ=[['parado','Parado',2],['andar','Andar',2],['golpe','Golpe',2],['escudo','Escudo',1],['pesado','Pesado',2],['ferido','Ferido',2]];
const acts=[{bg:['#2a1a10','#120a06'],col:[255,160,70],amb:[60,40,40],dir:-1,torch:[60,70]},{bg:['#101a24','#06080c'],col:[140,210,255],amb:[40,60,60],dir:1,torch:[180,70]},{bg:['#24101a','#0a0408'],col:[255,90,50],amb:[90,40,120],dir:-1,torch:[60,70]}];
let si=0,f=0,loop=0,act=0,last=0;
function frame(t){requestAnimationFrame(frame);if(t-last<1000/11)return;last=t;
  const [k,name,loops]=SEQ[si],A=ANIM[k],L=acts[act];
  const g=X.createLinearGradient(0,0,0,135);g.addColorStop(0,L.bg[0]);g.addColorStop(1,L.bg[1]);X.fillStyle=g;X.fillRect(0,0,240,135);
  const fl=.85+Math.random()*.15;const rg=X.createRadialGradient(L.torch[0],L.torch[1],2,L.torch[0],L.torch[1],70*fl);rg.addColorStop(0,`rgba(${L.col},.35)`);rg.addColorStop(1,'rgba(0,0,0,0)');X.fillStyle=rg;X.fillRect(0,0,240,135);
  X.fillStyle=`rgb(${L.col})`;X.fillRect(L.torch[0]-1,L.torch[1]-4,2,4);X.fillStyle='#3a2a1a';X.fillRect(L.torch[0]-1,L.torch[1],2,8);
  X.fillStyle='#1a120c';X.fillRect(0,108,240,27);X.fillStyle='rgba(0,0,0,.35)';X.fillRect(0,108,240,2);
  const spr=lightPass(cp(R.draw(A.f(f,A.n))),{dir:L.dir,col:L.col,amb:L.amb});
  X.globalAlpha=.35;X.fillStyle='#000';X.beginPath();X.ellipse(120,108,11,2,0,0,7);X.fill();X.globalAlpha=1;
  X.drawImage(spr,100,64);
  // reflexo no chão molhado
  X.save();X.globalAlpha=.18;X.translate(0,108*2+2);X.scale(1,-1);X.drawImage(spr,100,64);X.restore();
  document.getElementById('t').textContent=name+' · Ato '+(act+1);
  f++;if(f>=A.n){f=0;loop++;if(loop>=loops){loop=0;si++;if(si>=SEQ.length){si=0;act=(act+1)%3}}}}
requestAnimationFrame(frame);document.title='ok';
</script></body></html>
