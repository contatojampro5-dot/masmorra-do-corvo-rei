<!doctype html><html><head><meta charset="utf-8"><title>Inimigos · quadros</title><style>body{margin:0;background:#141010;color:#e8d9b8;font:14px Georgia}h2{margin:14px 16px 4px;color:#e8c27a;font-size:17px}h3{margin:6px 16px 2px;font-size:13px;opacity:.8;font-weight:normal}.row{display:flex;flex-wrap:wrap;gap:2px;margin:0 16px}canvas{image-rendering:pixelated}</style></head><body>
<script src="../cavaleiro-novo/rig.js"></script><script src="bichos.js"></script><script src="bichos2.js"></script><script src="bichos3.js"></script><script src="bichos4.js"></script><script src="bichos5.js"></script><script src="bichos6.js"></script><script>
const LUZ={dir:-1,col:[255,160,70],amb:[60,40,40]};
const sc=(c,k)=>{const o=document.createElement('canvas');o.width=c.width*k;o.height=c.height*k;const x=o.getContext('2d');x.fillStyle='#2a1a12';x.fillRect(0,0,o.width,o.height);x.fillStyle='#3a2618';x.fillRect(0,BICHO.GY*k+k,o.width,o.height);x.imageSmoothingEnabled=false;x.drawImage(c,0,0,o.width,o.height);return o};
const Q=new URLSearchParams(location.search),so=Q.get('so'),K=+(Q.get('k')||2),SO_A=Q.get('a');
if(Q.get('retrato')){const r=document.createElement('div');r.className='row';for(const id in BICHOS){if(so&&!so.split(',').includes(id))continue;const fr=(Q.get('f')||'0').split(',');for(const f of fr){const [an,fi]=f.includes(':')?f.split(':'):['parado',f];const s=BICHO.seq(id,an);if(s)r.appendChild(sc(BICHO.quadro(id,s[Math.min(+fi,s.length-1)],LUZ),K))}}document.body.appendChild(r);document.title='ok';throw 0}
for(const [id,B] of Object.entries(BICHOS)){if(so&&!so.split(',').includes(id))continue;const h=document.createElement('h2');h.textContent=B.nome;document.body.appendChild(h);
  for(const [nome,A] of Object.entries(B.A)){if(SO_A&&!SO_A.split(',').includes(nome))continue;const t=document.createElement('h3');t.textContent=nome+(A.nome?' · '+A.nome:'')+(A.hits?' · acerta no quadro '+A.hits.join(' e '):'');document.body.appendChild(t);
    const r=document.createElement('div');r.className='row';const s=BICHO.seq(id,nome);const passo=s.length>14?2:1;for(let f=0;f<s.length;f+=passo)r.appendChild(sc(BICHO.quadro(id,s[f],LUZ),K));document.body.appendChild(r)}}
document.title='ok';
</script></body></html>
