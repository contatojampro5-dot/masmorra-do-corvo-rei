<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Heróis animados</title>
<style>:root{--bg:#120d0a;--card:#1e1610;--line:#4a3a28;--ouro:#e8c25a;--txt:#e8d9b8}body{margin:0;background:var(--bg);color:var(--txt);font:14px Georgia,serif}
header{padding:14px 16px 4px}h1{margin:0;color:var(--ouro);font-size:22px}header p{margin:4px 0 0;opacity:.75}
.bar{display:flex;gap:6px;flex-wrap:wrap;padding:8px 16px}button{background:#2c2016;color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:5px 9px;font:13px Georgia;cursor:pointer}button.on{background:#5a3a1a;border-color:var(--ouro)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;padding:8px 16px 20px}.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px}
.card h2{margin:0 0 6px;font-size:16px;color:var(--ouro)}.card canvas{width:100%;image-rendering:pixelated;border-radius:6px;display:block}.acao{height:18px;font-size:13px;opacity:.85;margin:4px 0}.bts{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}.armas button{font-size:12px;padding:3px 7px}</style></head><body>
<header><h1>Heróis animados</h1><p>Os 4 heróis no estilo do Cavaleiro novo. Troque a arma (as 6 da forja) e toque nos movimentos.</p></header>
<div class="bar"><button data-ato="1" class="on">Ato 1</button><button data-ato="2">Ato 2</button><button data-ato="3">Ato 3</button><button id="demo">▶ Mostrar tudo</button></div>
<div class="grid" id="g"></div>
<script src="../cavaleiro-novo/rig.js"></script><script src="../inimigos/bichos.js"></script><script src="herois.js"></script><script>
const LUZ={1:{dir:-1,col:[255,160,70],amb:[60,40,40]},2:{dir:1,col:[140,210,255],amb:[40,60,60]},3:{dir:-1,col:[255,90,50],amb:[90,40,120]}};
const FUNDO={1:['#2a1a10','#3a2618'],2:['#101a1e','#1a2a2e'],3:['#24101a','#3a1a24']};
const NOMES={ferido:'Apanha',morte:'Cai'};const CORT={flecha:'#e8dcc0',faisca:'#8ad8ff',grande:'#b0e8ff'};
let ato=1;const K=5,EX=40,cards=[];
for(const [id,B] of Object.entries(HEROIS)){const d=document.createElement('div');d.className='card';const bid='h_'+id;
  d.innerHTML=`<h2>${B.nome}</h2><canvas width="${(B.W+EX)*K}" height="${B.H*K}"></canvas><div class="acao"></div><div class="bts armas"></div><div class="bts acoes"></div>`;
  const st={id:bid,B,cv:d.querySelector('canvas'),acao:d.querySelector('.acao'),anim:'parado',f:0,t:0,arma:0,cache:{},tiros:[],fx:[],fim:null};
  B.armas.forEach((n,i)=>{const b=document.createElement('button');b.textContent=(i+1)+'. '+n;if(!i)b.className='on';b.onclick=()=>{st.arma=i;st.cache={};d.querySelectorAll('.armas button').forEach((x,j)=>x.classList.toggle('on',j===i))};d.querySelector('.armas').appendChild(b)});
  for(const n of Object.keys(B.A)){if(n==='parado')continue;const b=document.createElement('button');b.textContent=B.A[n].nome||NOMES[n]||n;b.onclick=()=>toca(st,n);d.querySelector('.acoes').appendChild(b)}
  document.getElementById('g').appendChild(d);cards.push(st)}
document.querySelectorAll('[data-ato]').forEach(b=>b.onclick=()=>{ato=+b.dataset.ato;document.querySelectorAll('[data-ato]').forEach(x=>x.classList.toggle('on',x===b));cards.forEach(c=>c.cache={})});
function toca(st,n){return new Promise(r=>{st.anim=n;st.f=0;st.t=0;st.fim=r;st.acao.textContent=st.B.A[n].nome||NOMES[n]||n})}
let last=performance.now();
function loop(t){const dt=Math.min(80,t-last);last=t;
  for(const st of cards){const A=st.B.A[st.anim],sq=BICHO.seq(st.id,st.anim);st.t+=dt;const step=1000/A.fps;
    while(st.t>=step){st.t-=step;st.f++;if(A.hits&&A.hits.includes(st.f))st.pend=A.tiro||'golpe';
      if(st.f>=sq.length){if(A.loop)st.f=0;else if(st.anim==='morte'||st.anim==='vitoria'){st.f=sq.length-1;if(st.fim){const r=st.fim;st.fim=null;r()}}else{const r=st.fim;st.fim=null;st.anim='parado';st.f=0;st.acao.textContent='';if(r)r()}}}
    const key=st.anim+'|'+st.f+'|'+st.arma;let q=st.cache[key];if(!q)q=st.cache[key]=BICHO.quadro(st.id,{...BICHO.seq(st.id,st.anim)[st.f],arma:st.arma},LUZ[ato]);
    if(st.pend){const b=q.boca||[30,30];if(st.pend==='golpe'){for(let i=0;i<12;i++){const a=Math.random()*6.28;st.fx.push({x:b[0]+6,y:b[1],vx:Math.cos(a)*1.2+.5,vy:Math.sin(a)*1.2-.4,l:16,col:'#ffe9a8'})}}else st.tiros.push({x:b[0],y:b[1],k:st.pend});st.pend=null}
    const x=st.cv.getContext('2d'),BW=st.B.W+EX,BH=st.B.H,GG=st.B.GY;x.imageSmoothingEnabled=false;const F=FUNDO[ato];x.fillStyle=F[0];x.fillRect(0,0,BW*K,BH*K);x.fillStyle=F[1];x.fillRect(0,(GG+1)*K,BW*K,BH*K);
    x.fillStyle='#3a2a1e';x.fillRect((BW-10)*K,(GG-14)*K,6*K,14*K);x.fillStyle='#5a4030';x.fillRect((BW-10)*K,(GG-14)*K,6*K,K);
    x.drawImage(q,0,0,st.B.W*K,BH*K);
    st.tiros=st.tiros.filter(tt=>{tt.x+=2.4;if(tt.x>BW-10){for(let i=0;i<10;i++){const a=Math.random()*6.28;st.fx.push({x:BW-10,y:tt.y,vx:Math.cos(a),vy:Math.sin(a)-.4,l:14,col:CORT[tt.k]||'#fff'})}return false}
      x.fillStyle=CORT[tt.k]||'#fff';if(tt.k==='flecha'){x.fillRect(Math.round(tt.x-8)*K,Math.round(tt.y)*K,8*K,K);x.fillStyle='#ffffff';x.fillRect(Math.round(tt.x)*K,Math.round(tt.y)*K,K,K)}else{const r=tt.k==='grande'?3:1.5;x.fillRect(Math.round(tt.x-r)*K,Math.round(tt.y-r)*K,Math.round(r*2)*K,Math.round(r*2)*K);x.fillStyle='#ffffff';x.fillRect(Math.round(tt.x)*K,Math.round(tt.y)*K,K,K)}return true});
    st.fx=st.fx.filter(p=>p.l-->0);for(const p of st.fx){p.x+=p.vx;p.y+=p.vy;p.vy+=.06;x.globalAlpha=Math.min(1,p.l/8);x.fillStyle=p.col;x.fillRect(Math.round(p.x)*K,Math.round(p.y)*K,K,K)}x.globalAlpha=1}
  requestAnimationFrame(loop)}
requestAnimationFrame(loop);
const espera=ms=>new Promise(r=>setTimeout(r,ms));
async function demo(st){let a=0;for(;;){st.arma=a%6;st.cache={};const bs=st.cv.parentNode.querySelectorAll('.armas button');bs.forEach((x,j)=>x.classList.toggle('on',j===st.arma));
  for(const n of Object.keys(st.B.A)){if(n==='parado'||n==='morte'||n==='vitoria')continue;await espera(600);await toca(st,n)}await espera(500);await toca(st,'vitoria');await espera(900);st.anim='parado';st.f=0;st.acao.textContent='';a++}}
document.getElementById('demo').onclick=()=>cards.forEach((c,i)=>setTimeout(()=>demo(c),i*150));if(location.hash==='#demo')document.getElementById('demo').click();
</script></body></html>
